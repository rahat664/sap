<div class="flex flex-col space-y-3">
  <div class="flex flex-col space-y-3">
    <div class="flex mx-4 justify-between py-3 items-center">
      <h1 class="text-h1 font-semibold">New Trip</h1>
    </div>
    <div class="bg-white p-4 m-4 rounded-lg flex justify-between items-center">
      <div class="flex flex-1 flex-col relative">
        <label for="customerName" class="form-label">Customer Name</label>
        <mat-form-field appearance="outline" class="example-full-width w-1/3">
          <input
            id="customerName"
            type="text"
            matInput
            (keyup)="onKeyUpCustomerSearch($event)"
            [(ngModel)]="customerName"
            [matAutocomplete]="auto">
          <mat-autocomplete #auto="matAutocomplete">
            @for (option of companySuggestions; track option) {
              <mat-option (click)="onClickCustomerSearchSuggestion(option)" [value]="option.name">{{ option.name }}
              </mat-option>
            }
          </mat-autocomplete>
        </mat-form-field>
      </div>
      <button
        type="button"
        routerLink="/trip-list/trip-create?create"
        *ngIf="createButtonEnabled" class="bg-primary text-white rounded-lg px-16 py-3"
        (click)="onCreateTrip()">Create
        Trip
      </button>
    </div>
  </div>
  <div class="bg-white mx-4 rounded-lg" *ngIf="templates">
    <div class="px-4 py-2 flex justify-between items-center">
      <h1 class="text-body">Saved Template</h1>
      <button class="border border-primary text-primary font-semibold rounded-lg px-4 py-2">Create Template</button>
    </div>
    <div>
      <table class="table-auto w-full text-[0.875rem]">
        <thead>
        <tr>
          <th class="text-left">Name</th>
          <th class="text-left">Route</th>
          <th class="text-left">Goods</th>
          <th class="text-left">Customer</th>
          <th class="text-left"></th>
        </tr>
        <tr>
          <th class="custom-borders" colspan="9"></th>
        </tr>
        </thead>
        <tbody>
        <tr *ngFor="let tripTemplate of templates">
          <td>
            <a (click)="setTemplate(tripTemplate)" class="w-full text-link cursor-pointer">{{ tripTemplate.name }}</a>
          </td>
          <td>{{ getTripRoute(tripTemplate.points) }}</td>
          <td>{{ tripTemplate.good.name }}</td>
          <td>{{ customerName }}</td>
          <td>
            <div class="relative w-full text-right">
              <button
                class="cursor-pointer w-full">
                <i class="fas fa-ellipsis-v"></i>
              </button>
            </div>
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
