<div>
  <div class="mx-4 py-2 flex justify-between items-center">
    <h1 class="text-h1 font-semibold">New Trip</h1>
    <button
      class="bg-primary text-white rounded-lg px-16 py-3"
      (click)="onCreateTrip()">Create Trip
    </button>
  </div>
  <div class="p-4">

    <form [formGroup]="tripForm" class="rounded-lg bg-white w-full">
      <div class="mx-8 flex flex-col space-y-3 py-8  border-b-2 border-input">
        <div class="flex items-center space-x-3">
          <img class="notPreview" src="assets/svg/candt.svg" alt="candt">
          <span class="text-h2 font-semibold">Customer and time</span>
        </div>
        <div class="grid lg:grid-cols-2 gap-4 w-full ">
          <div class="flex flex-col space-y-1 w-full">
            <label for="customerName" class="form-label text-body">Customer Name</label>
            <mat-form-field appearance="outline" id="customerName">
              <input matInput placeholder="Enter Customer Name">
            </mat-form-field>
          </div>
          <div class="flex flex-col space-y-1 w-full">
            <label for="date" class="form-label text-body">Date and time</label>
            <button class="customButton" mat-button [matMenuTriggerFor]="dateAndTime">
              <mat-form-field appearance="outline" id="date" class="example-full-width w-full">
                <input placeholder="Select date and time" matInput />
                <mat-datepicker-toggle matIconSuffix></mat-datepicker-toggle>
              </mat-form-field>
            </button>
            <mat-menu class="flex flex-col space-y-3" #dateAndTime="matMenu">
              <mat-card class="w-96">
                <mat-calendar [minDate]="minDate" (selectedChange)="onSelect($event)"></mat-calendar>
              </mat-card>
              <mat-card class="w-96 mt-3 flex items-center justify-center">
                <app-time-picker (click)="$event.stopPropagation()"></app-time-picker>
              </mat-card>
            </mat-menu>
          </div>
        </div>
      </div>
      <div class="mx-8 flex flex-col space-y-3 py-8  border-b-2 border-input">
        <div class="flex items-center space-x-3">
          <img class="notPreview" src="assets/svg/locinfo.svg" alt="candt">
          <span class="text-h2 font-semibold">Location info</span>
        </div>
        <div class="grid lg:grid-cols-2 gap-4 w-full ">
          <div class="flex flex-col space-y-1 w-full">
            <label for="loadingPoint" class="form-label text-body">Loading Point</label>
            <input
              type="text"
              class="bg-input rounded-lg border-none px-4 py-4"
              placeholder="Address"
              id="loadingPoint"
              formControlName="loadingPointName"
            />
          </div>
          <div class="flex flex-col space-y-1 w-full">
            <label for="loadingPoint" class="form-label text-body">Loading District</label>
            <input
              type="text"
              class="bg-input rounded-lg border-none px-4 py-4"
              placeholder="District name"
              id="loadingDistrict"
              formControlName="loadingPointDistrict"
            />
          </div>
          <div class="flex flex-col space-y-1 w-full">
            <label for="unLoadingPoint" class="form-label text-body">Unloading Point</label>
            <input
              type="text"
              class="bg-input rounded-lg border-none px-4 py-4"
              placeholder="Address"
              id="unLoadingPoint"
              formControlName="unloadingPointName"
            />
          </div>
          <div class="flex flex-col space-y-1 w-full">
            <label for="unLoadingDistrict" class="form-label text-body">Unloading District</label>
            <input
              type="text"
              class="bg-input rounded-lg border-none px-4 py-4"
              placeholder="District name"
              id="unLoadingDistrict"
              formControlName="unloadingPointDistrict"
            />
          </div>
        </div>
      </div>
      <div class="mx-8 flex flex-col space-y-3  py-8 col-span-3 border-b-2 border-input ">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-3">
            <img class="notPreview" src="assets/svg/locinfo.svg" alt="candt">
            <span class="text-h2 font-semibold">Location info</span>
          </div>
          <div
            *ngIf="scrollable"
            class="flex space-x-1  items-center">
            <button
              type="button"
              data-direction="left"
              (click)="onClickLeftButton()"
              [disabled]="!rightButtonClicked"
              class="{{
              rightButtonClicked
                ? 'text-white bg-primary'
                : 'text-disabled bg-input-hint'
            }} flex items-center justify-center rounded-full h-[1.25rem] w-[1.25rem]">
              <i class="fal fa-angle-left text-xl"></i>
            </button>
            <button
              type="button"
              data-direction="right"
              (click)="onClickRightButton()"
              [disabled]="rightButtonClicked"
              class="{{
              rightButtonClicked
                ? 'text-disabled bg-input-hint'
                : 'text-white bg-primary'
            }} flex items-center justify-center rounded-full h-[1.25rem] w-[1.25rem]">
              <i class="fal fa-angle-right text-xl"></i>
            </button>
          </div>
        </div>
        <div class="overflow-hidden border border-link relative py-1 px-4 w-full rounded-lg bg-white">
          <div
            appScrollByButton
            (isVisible)="scrollable = $event"
            [rightButtonClicked]="rightButtonClicked"
            [leftButtonClicked]="leftButtonClicked"
            class="h-full w-full overflow-hidden">
            <div class="flex relative space-x-2 items-center h-full">
              <ng-container *ngFor="let item of vehicleTypeList">
                <button
                  type="button"
                  class="bg-input rounded-lg px-4 py-2"
                  [class.bg-primary]="item.isActive"
                  (click)="onVehicleTypeClick(item)"
                >
                  <div class="w-[5rem] h-[3rem] flex items-center justify-center">
                    <img class="w-full notPreview" [src]="item.imageUrl" [alt]="item.name">
                  </div>
                  <span class="whitespace-nowrap text-body_title">{{ item.name }}</span>
                </button>
              </ng-container>
            </div>
          </div>
        </div>
        <div class="grid lg:grid-cols-3 gap-4 w-full relative">
          <div class="flex flex-col space-y-1 w-full">
            <label for="numOfVehicle" class="form-label text-body">No. of vehicle</label>
            <input
              type="number"
              class="bg-input rounded-lg border-none px-4 py-4"
              placeholder="Enter number"
              id="numOfVehicle"
            />
          </div>
          <div class="flex flex-col space-y-2 w-full">
            <label for="size" class="form-label text-body">Size</label>
            <input
              type="number"
              step=".1"
              min="1"
              class="bg-input rounded-lg border-none px-4 py-4"
              placeholder="Feet"
              id="size"
            />
            <div class="w-full flex space-x-2 items-center">
              <span>Sug:</span>
              <button type="button" (click)="onClickTruckSizeSuggestions(suggestion)"
                      class="w-12 h-6 rounded-full flex items-center justify-center border border-input-hint text-[0.75rem]"
                      [ngClass]="{'bg-green text-white': suggestion.selected}"
                      *ngFor="let suggestion of truckSizeSuggestions">
                <span>{{ suggestion.value }}</span>
              </button>
            </div>
          </div>
          <div class="flex flex-col space-y-2 w-full">
            <label for="capacity" class="form-label text-body">Capacity</label>
            <input
              type="number"
              step=".1"
              class="bg-input rounded-lg border-none px-4 py-4"
              placeholder="Capacity"
              id="capacity"
            />
            <div class="w-full flex space-x-2 items-center">
              <span>Sug:</span>
              <button type="button" (click)="onClickTruckCapacitySuggestions(suggestion)"
                      class="w-12 h-6 rounded-full flex items-center justify-center border border-input-hint text-[0.75rem]"
                      [ngClass]="{'bg-green text-white': suggestion.selected}"
                      *ngFor="let suggestion of truckCapacitySuggestions">
                <span>{{ suggestion.value }}</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <div class="mx-8 flex flex-col space-y-3  py-8 col-span-3 border-b-2 border-input ">
        <div class="grid lg:grid-cols-2 gap-4 w-full">
          <div class="flex flex-col space-y-3">
            <div class="flex space-x-3 items-center">
              <img class="notPreview" src="assets/svg/goodsinfo.svg" alt="candt">
              <h1 class="text-h2 font-semibold">Goods Info</h1>
            </div>
            <div class="flex flex-col space-y-1 w-full">
              <label for="goods" class="form-label text-body">Goods Type</label>
              <mat-form-field appearance="outline" id="goods">
                <mat-select [(value)]="leftButtonClicked" placeholder="Select Goods">
                  <mat-option>None</mat-option>
                  <mat-option value="option1">Option 1</mat-option>
                  <mat-option value="option2">Option 2</mat-option>
                  <mat-option value="option3">Option 3</mat-option>
                </mat-select>
              </mat-form-field>
            </div>
          </div>
          <div class="flex flex-col space-y-3">
            <div class="flex space-x-3 items-center">
              <img class="notPreview" src="assets/svg/cr.svg" alt="candt">
              <h1 class="text-h2 font-semibold">Customer Rate (CR)</h1>
            </div>
            <div class="flex flex-col space-y-1 w-full">
              <label for="customerRate" class="form-label text-body">Customer rate</label>
              <!--Add a bdt icon at the end of the input-->
              <div class="relative bg-input rounded-lg border-none">
                <input
                  [autocomplete]="false"
                  type="password"
                  class="border-none bg-input rounded-lg outline-none px-4 py-4 w-full"
                  placeholder="Enter amount"
                  id="customerRate" />
                <img
                  id="icon"
                  class="notPreview absolute right-4 top-4 cursor-pointer"
                  src="assets/svg/bdt.svg"
                  alt="bdt"
                >
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="mx-8 flex flex-col space-y-3  py-8 col-span-3">
        <div class="flex space-x-3">
          <img class="notPreview" src="assets/svg/additional.svg" alt="candt">
          <h1 class="text-h2 font-semibold">Additional info</h1>
        </div>
        <textarea class="bg-input rounded-lg border-none px-4 py-4 w-full" placeholder="Write here"></textarea>
      </div>
      <div class="flex space-x-3 items-center col-span-3 mx-8 pb-8">
        <input type="checkbox" (change)="toggleSaveAsTemplateInputField($any($event))">
        <span class="text-body">Save as template for future use</span>
      </div>
      <div class="mx-8 pb-8" *ngIf="saveTemplateInputEnabled">
        <div class="grid lg:grid-cols-2 gap-4 w-full">
          <div class="flex flex-col space-y-1">
            <label class="form-label text-body" for="templateName">Template Name</label>
            <input type="text"
                   class="bg-input rounded-lg border-none px-4 py-4"
                   placeholder="Template Name"
                   id="templateName">
          </div>
        </div>
      </div>
    </form>
  </div>
</div>
