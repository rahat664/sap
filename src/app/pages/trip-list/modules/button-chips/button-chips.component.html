<button [disabled]="isDisabled" class="w-[8.75rem] h-[5.625rem] rounded-lg border border-blue"
        [ngClass]="{'border-none bg-green': isActive}">
  <h1 [ngClass]="{'text-white': isActive}" class="text-not-black text-h2 font-semibold">{{ count }}</h1>
  <span [ngClass]="{'text-white': isActive}" class="text-web-text-secondary text-body">{{ Status }}</span>
</button>
