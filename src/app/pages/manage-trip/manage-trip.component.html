<div *ngIf="!mobileDeviceDetails" class="flex bg-[#EFF6F8]">
  <div class="flex flex-col w-full md:min-w-[25rem] md:max-w-[25rem]">
    <div
      class="py-4 px-4 flex flex-col space-y-3"
      appGetElementHeight
      (height)="height = $event">
      <div class="flex justify-between items-center">
        <span class="text-h2 leading-h2 font-semibold">Trip List</span>
      </div>
      <app-trip-search-bar
        *ngIf="!filterOpen"
        [loading]="loading"
        [searchValue]="searchValue"
        [filterCount]="filterValues.length"
        (search)="onSearchInput($event)"
        (clear)="onClickClear()"
        (openFilter)="onClickFilterOpen()"
      ></app-trip-search-bar>
      <app-status-chips-carousel
        *ngIf="!filterOpen"
        [loading]="loading"
        [statusButtons]="statusButtons"
        [rightButtonClicked]="rightButtonClicked"
        [leftButtonClicked]="leftButtonClicked"
        [scrollable]="scrollable"
        (statusClick)="onClickButton($event)"
        (leftClick)="onClickLeftButton()"
        (rightClick)="onClickRightButton()"
        (scrollableChange)="scrollable = $event"
      ></app-status-chips-carousel>
    </div>
    <div
      *ngIf="!loading && !filterOpen"
      class="flex flex-col py-1 space-y-4 min-w-96">
      <div *ngIf="filterLength > 0" appGetElementHeight (height)="filterHeight = $event">
        <app-filter-chips-summary
          [filterValues]="filterValues"
          [selectedTruckValues]="selectedTruckValues"
          [dateText]="dateText"
          [customDateText]="customDateText"
          [customSelected]="customSelected"
          [buttonName]="buttonName"
          [paymentTypePlaceholder]="paymentTypePlaceholder"
          [tripTypePlaceholder]="tripTypePlaceholder"
          (closeFilter)="onClickCloseFilter($event)"
          (closePaymentType)="onClickClosePaymentType()"
          (closeTripType)="onClickCloseTripType()"
        ></app-filter-chips-summary>
      </div>
      <app-trip-list-view
        [loading]="loading"
        [filterOpen]="filterOpen"
        [filterLength]="filterLength"
        [height]="height"
        [filterHeight]="filterHeight"
        [totalPages]="totalPages"
        [tripList]="tripList"
        [activatedId]="activatedId"
        [anotherItemsHeight]="customizedHeight(height, filterHeight)"
        (inBottomEnd)="onScrollEnd($event)"
        (tripSelected)="onclickTripCard($event.tripId, getTruckRegistrationNumber($event.truck), $event.status, $event.truckSize)"
      ></app-trip-list-view>
    </div>
    <div
      class="flex flex-col items-center justify-center h-[calc(100vh-11.7rem)] min-w-96"
      *ngIf="loading">
      <!--       make a spinner component-->
      <i class="fas fa-spinner fa-spin text-primary text-4xl"></i>
      <span class="text-center w-full text-secondary">Loading...</span>
    </div>
    <div
      class="flex items-center justify-center h-[calc(100vh-11.7rem)] min-w-96"
      *ngIf="!loading && tripList.length <= 0 && !filterOpen">
      <div class="w-full flex flex-col space-y-3 justify-center items-center">
        <img
          loading="lazy"
          src="assets/svg/no-data.svg"
          class="notPreview"
          alt="nodata"/>
        <p
          class="text-body_title leading-body_title text-secondary font-semibold">
          No Data Found
        </p>
      </div>
    </div>
    <app-manage-trip-filters
      *ngIf="filterOpen"
      [filterLength]="filterLength"
      [buttonName]="buttonName"
      [selectedButton]="selectedButton"
      [dateText]="dateText"
      [customDateText]="customDateText"
      [customSelected]="customSelected"
      [startDate]="startDate"
      [endDate]="endDate"
      [vehicleTypeList]="vehicleTypeList"
      [truckType]="truckType"
      [paymentTypeOptionsArray]="paymentTypeOptionsArray"
      [paymentTypeValue]="paymentTypeValue"
      [tripTypeOptionsArray]="tripTypeOptionsArray"
      [tripTypeValue]="tripTypeValue"
      [loading]="loading"
      [showCustomer]="isAdmin() && isPermissionGranted('customer','view_all') && customerIsNotEnterprise()"
      [showTransporter]="isAdmin()"
      [customerName]="customerName"
      [customers]="customers"
      [companySuggestions]="companySuggestions"
      [transporterName]="transporterName"
      [transporters]="transporters"
      [transporterSuggestions]="transporterSuggestions"
      (clearAll)="onClickClearAll()"
      (close)="onClickFilterClose()"
      (filterButtonClick)="onClickFilterButton($event)"
      (startDateChange)="onChangeStartDate($event)"
      (endDateChange)="onChangeEndDate($event)"
      (truckTypeChange)="onChangeTruckType($event)"
      (tripTypeChange)="onChangeTripType($event)"
      (paymentTypeChange)="onChangePaymentType($event)"
      (apply)="onClickApply()"
      (customerQueryChange)="onKeyUpCustomerSearch($event)"
      (customerSuggestionSelect)="onClickCustomerSearchSuggestion($event)"
      (customerRemove)="onClickCloseCustomer($event)"
      (transporterQueryChange)="onKeyUpTransporterSearch($event)"
      (transporterSuggestionSelect)="onClickTransporterSearchSuggestion($event)"
      (transporterRemove)="onClickCloseTransporter($event)"
    ></app-manage-trip-filters>
  </div>
  <div class="hidden md:block w-full h-[calc(100vh-4.5rem)] flex-1 relative">
    <app-g-map
      [singleTripData]="singleTripDetails"
      [truckSizeInFeet]="activatedTruckSizeInFeet"
      (clearInput)="onClearInput($event)"
      [truckFullRegistrationNumber]="truckRegistrationNumbers"
      [truckLocationPosition]="truckLocationPosition"
      [trackerEnabled] = "truckerEnabled"
      [starting]="startingPosition"
      [destination]="destinationPosition"
      [tripStatus]="tripStatus"></app-g-map>
    <app-map-buttons
      [isButtonDisabled]="loading"
      [triggeredButtonName]="triggerFromParentName"
      [triggerFromParent]="isTriggerFromParent"
      [statusButtons]="statusButtons"
      (buttonClickEmitter)="onClickButton($event)"
      class="hidden md:block absolute top-0 right-1/2 transform translate-x-1/2">
    </app-map-buttons>
    <app-trip-details
      appGetElementHeight
      (height)="onChangeHeight($event)"
      (foldUnfoldChange)="onClickFold($event)"
      *ngIf="singleTripDetails"
      [tripDetails]="singleTripDetails"
      class="absolute bottom-0 w-full slide-top"></app-trip-details>
  </div>
</div>

<app-mobile-trip-details
  *ngIf="mobileDeviceDetails"
  [loading]="loading"
  [singleTripDetails]="singleTripDetails"
  [activatedTruckSizeInFeet]="activatedTruckSizeInFeet"
  [truckRegistrationNumbers]="truckRegistrationNumbers"
  [truckLocationPosition]="truckLocationPosition"
  [truckerEnabled]="truckerEnabled"
  [startingPosition]="startingPosition"
  [destinationPosition]="destinationPosition"
  [tripStatus]="tripStatus"
  [triggerFromParentName]="triggerFromParentName"
  [isTriggerFromParent]="isTriggerFromParent"
  [statusButtons]="statusButtons"
  (back)="onClickBack()"
  (clearInput)="onClearInput($event)"
  (buttonClickEmitter)="onClickButton($event)"
  (height)="onChangeHeight($event)"
  (foldUnfoldChange)="onClickFold($event)"
></app-mobile-trip-details>
