<div class="sticky top-0 flex items-start justify-between bg-white z-50">
  <h1 class="text-h3  font-semibold text-not-black px-6 py-4">Truck</h1>
  <button class="text-bold h-8 w-8 m-2 rounded-full hover:bg-input flex items-center justify-center"
          (click)="closeDialog()">
    <i class="fas fa-times"></i>
  </button>
</div>
<div *ngIf="loading" class="w-full h-full flex flex-col justify-center items-center">
  <i class="fas fa-spinner fa-spin text-primary text-4xl"></i>
  <span class="text-center w-full text-secondary">Loading...</span>
</div>

<div appGiveMaxHeight (inBottomEnd)="onBottom($event)" class="px-8 flex flex-col space-y-2">
  <button (click)="onSelectTruck(truck)" *ngFor="let truck of truckList"
          class="flex w-full space-x-4 py-4 px-4 rounded-sm hover:bg-input border-b border-input items-center">
    <div
      class="w-[1.875rem] h-[1.875rem] rounded-full bg-another text-white font-semibold flex items-center justify-center">
      <span>{{ truck.fullRegistrationNumber.charAt(0) }}</span>
    </div>
    <span class="text-body text-not-black">{{ truck.fullRegistrationNumber }}</span>
  </button>
</div>
