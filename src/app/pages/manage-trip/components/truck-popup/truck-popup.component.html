<div class="sticky top-0  bg-white z-50">
  <div class="flex w-full justify-between items-center px-6 py-2">
    <h1 class="text-h3 leading-h3 font-semibold text-not-black">
      Truck
    </h1>
    <div class="flex space-x-4">
      <button
        class="text-bold h-8 w-8 m-2 rounded-full hover:bg-input flex items-center justify-center"
        (click)="closeDialog()">
        <i class="fal fa-times"></i>
      </button>
    </div>
  </div>
  <button
    class="text-bold w-full px-6 text-center text-link"
    routerLink="/profile/truck/add" (click)="informParent()" >
    <i class="fal fa-plus text-sm mr-2"></i>
    Add Truck
  </button>
  <div class="relative mx-6 my-3 ">
    <div
      class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <img src="assets/svg/search.svg" class="notPreview" alt="search"/>
    </div>
    <button
      (click)="onClickClear()"
      *ngIf="searchValue"
      class="absolute inset-y-0 right-0 pr-3 flex items-center">
      <i class="far fa-times text-gray-500 text-xs"></i>
    </button>
    <input
      [(ngModel)]="searchValue"
      (keyup)="onKeyUpSearch($event)"
      type="text"
      name="email"
      class="border-line text-input-hint w-full bg-white sm:text-sm rounded-lg focus:ring-cyan-600 focus:border-cyan-600 block pl-10 p-2.5"
      placeholder="Search By Truck Registration No." />
  </div>
</div>
<div
  *ngIf="loading"
  class="w-full h-full flex flex-col justify-center items-center">
  <i class="fas fa-spinner fa-spin text-primary text-4xl"></i>
  <span class="text-center w-full text-secondary">Loading...</span>
</div>

<div *ngIf="!loading && truckList?.length === 0" class="w-full h-full flex flex-col justify-center items-center">
  <img src="assets/svg/no-data.svg" class="notPreview" alt="noData"/>
  <span class="text-center w-full text-secondary">No data found</span>
</div>

<div
  #scrollMe
  class="px-8 flex flex-col space-y-2">
  <button
    (click)="onSelectTruck(truck)"
    *ngFor="let truck of truckList"
    class="flex w-full space-x-4 py-4 px-4 rounded-sm hover:bg-input border-b border-input items-center">
    <div
      class="w-[1.875rem] h-[1.875rem] rounded-full bg-another text-white font-semibold flex items-center justify-center">
      <span>{{ truck.fullRegistrationNumber.charAt(0) }}</span>
    </div>
    <span class="text-body text-not-black">{{
        truck.fullRegistrationNumber
      }}</span>
  </button>
</div>
