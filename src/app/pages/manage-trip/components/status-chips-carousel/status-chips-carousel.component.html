<div class="overflow-hidden md:hidden relative p-4 w-full rounded-lg md:min-h-44 bg-white">
  <div
    appScrollByButton
    (isVisible)="onVisibleChange($event)"
    [rightButtonClicked]="rightButtonClicked"
    [leftButtonClicked]="leftButtonClicked"
    class="h-full overflow-hidden"
  >
    <div class="flex relative space-x-4 pt-8 items-center h-full">
      <ng-container *ngFor="let item of statusButtons">
        <app-button-chips
          [isDisabled]="loading"
          [count]="item.count"
          [Status]="item.name"
          (click)="statusClick.emit(item.name)"
          [isActive]="item.isActive"
        ></app-button-chips>
      </ng-container>
    </div>
  </div>
  <div *ngIf="scrollable" class="absolute top-4 right-4 flex space-x-1 items-center">
    <button
      data-direction="left"
      (click)="onLeft()"
      [disabled]="!rightButtonClicked"
      class="{{ rightButtonClicked ? 'text-white bg-primary' : 'text-disabled bg-input-hint' }} flex items-center justify-center rounded-full h-[1.25rem] w-[1.25rem]"
    >
      <i class="fal fa-angle-left text-xl"></i>
    </button>
    <button
      data-direction="right"
      (click)="onRight()"
      [disabled]="rightButtonClicked"
      class="{{ rightButtonClicked ? 'text-disabled bg-input-hint' : 'text-white bg-primary' }} flex items-center justify-center rounded-full h-[1.25rem] w-[1.25rem]"
    >
      <i class="fal fa-angle-right text-xl"></i>
    </button>
  </div>
</div>
