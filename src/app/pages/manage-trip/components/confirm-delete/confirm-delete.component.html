<div class="sticky top-0 flex items-start justify-between bg-white z-50">
  <h1 class="text-h3 leading-h3  font-semibold text-not-black px-12 py-4"></h1>
  <button class="text-bold h-8 w-8 m-2 rounded-full hover:bg-input flex items-center justify-center"
          (click)="closeDialog()">
    <i class="fal fa-times"></i>
  </button>
</div>
<div class="w-full h-full flex flex-col px-8 p-4 pt-0">
  <div class="flex flex-col space-y-4 items-center">
    <div class="mb-4">
      <img ngSrc="assets/svg/delete-icon.svg" alt="warning" loading="lazy" class="notPreview">
    </div>
    <h1 class="text-h1_mobile leading-h1_mobile text-center text-not-black font-bold">{{ data?.title }}</h1>
    <p class="text-body text-center text-secondary">{{ data?.text }}</p>
    <button class="bg-red w-full text-white rounded-lg p-4 mt-4" (click)="confirmDelete()">Delete
    </button>
  </div>
</div>
