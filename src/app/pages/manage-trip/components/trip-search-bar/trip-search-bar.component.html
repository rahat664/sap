<div class="flex justify-between gap-3 items-center">
  <div class="relative w-full">
    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
      <img src="assets/svg/search.svg" class="notPreview" alt="search" />
    </div>
    <button
      type="button"
      (click)="onClear()"
      *ngIf="searchValue"
      class="absolute inset-y-0 right-0 flex items-center pr-4"
    >
      <i class="fal fa-times text-gray-500 text-xl"></i>
    </button>
    <input
      style="padding-right: 20px"
      [ngModel]="searchValue"
      (ngModelChange)="onKeyUp($event)"
      type="text"
      name="trip-search"
      class="border-none text-not-black text-h2 leading-h2 placeholder-input-hint w-full bg-white rounded-lg focus:ring-blue focus:border-blue block pl-10 py-[.875rem]"
      placeholder="Search by trip ID, customer code, transporter code"
    />
  </div>
  <button
    [disabled]="loading"
    (click)="onOpenFilter()"
    class="p-3 rounded-lg bg-white flex items-center justify-center"
  >
    <div class="relative">
      <img loading="lazy" class="notPreview" src="assets/svg/filter.svg" alt="filter" />
      <span
        *ngIf="filterCount > 0"
        class="absolute top-1 right-1 transform translate-x-1/2 -translate-y-1/2 bg-red text-white text-xs font-semibold rounded-full h-4 w-4 flex items-center justify-center"
      >
        {{ filterCount }}
      </span>
    </div>
  </button>
</div>
