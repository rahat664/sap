

<div class="sticky top-0 flex items-start justify-between bg-white z-50">
  <h1 class="text-h3 leading-h3  font-semibold text-not-black px-6 py-4"></h1>
  <button class="text-bold h-8 w-8 m-2 rounded-full hover:bg-input flex items-center justify-center"
          (click)="closeDialog()">
    <i class="fal fa-times"></i>
  </button>
</div>
<div class="w-full h-full flex flex-col py-4 px-12 pt-0">
  <div class="flex flex-col space-y-4 items-center">
    <div class="mb-4 flex flex-col space-y-2">
      <img src="assets/svg/warning-red.svg" alt="warning" loading="lazy" class="notPreview">
      <h1 class="text-h1_mobile leading-h1_mobile text-center text-not-black font-bold">{{ data?.title }}</h1>
    </div>
    <p class="w-2/3 text-body text-center text-secondary">Do you want to reject <span>{{data?.textPrefix}}</span> <span
      class="font-semibold text-body_title leading-body_title">{{ data?.text }}</span></p>
    <h1 class="text-h3 leading-h3 font-bold text-not-black self-start">Cause of trip Cancellation</h1>
    <div class="flex flex-col space-y-1 self-start">
      <mat-checkbox [checked]="checkThatValueIsAvailableOrNot('Rate mismatched')" value="Rate mismatched" (change)="onChangeReason($event)">
        Rate mismatched
      </mat-checkbox>
      <mat-checkbox [checked]="checkThatValueIsAvailableOrNot('Delayed reaching of truck')"
                    value="Delayed reaching of truck" (change)="onChangeReason($event)">
        Delayed reaching of truck
      </mat-checkbox>
      <mat-checkbox [checked]="checkThatValueIsAvailableOrNot('Trip cancelled by customer')"
                    value="Trip cancelled by customer" (change)="onChangeReason($event)">
        Trip cancelled by customer
      </mat-checkbox >
      <mat-checkbox [checked]="reason === 'Trip cancelled by transporter'"
                    value="Trip cancelled by transporter" (change)="onChangeReason($event)">
        Trip cancelled by transporter
      </mat-checkbox>
      <mat-checkbox [checked]="reasonTextArea" value="Others" (change)="onChangeReason($event)">
        Others
      </mat-checkbox>
    </div>
    <textarea *ngIf="data?.reasonAvailable && reasonTextArea" class="w-full h-32 border border-gray-300 rounded-lg p-4 mt-4" placeholder="Write Cause"
              [(ngModel)]="textareaReasons"></textarea>
    <button [ngClass]="{'bg-opacity-[30%]': reason === '' || (reasonTextArea && textareaReasons === '') }" [disabled]="reason === '' || (reasonTextArea && textareaReasons === '')"
            class="bg-red w-full text-white rounded-lg p-4 mt-4"
            (click)="confirmUpdate()">{{ data?.buttonText}}
    </button>
  </div>
</div>
