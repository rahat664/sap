<div class="bg-white rounded-lg p-4 flex flex-col space-y-3">
  <div class="flex justify-between">
    <div class="flex space-x-3 items-center">
      <img src="assets/svg/document.svg" class="notPreview" alt="document" />
      <span class="text-h2 leading-h2 font-semibold text-not-black">{{ documentName }}</span>
    </div>
    <a *ngIf="documents?.length > 0" (click)="viewAllDocument()" class="text-link cursor-pointer">View all</a>
  </div>
  <div class="flex flex-col space-y-1">
    <ng-container *ngFor="let doc of documentTypes">
      <div
        class="flex justify-between items-center min-h-[4.25rem] bg-input rounded-lg pl-3 pr-6">
        <div class="flex space-x-4 items-center" >
          <ng-container *ngIf="!checkDocumentType(doc.name).uploaded && (categorizedDocuments[doc.documentType]?.length === 0 || !categorizedDocuments[doc.documentType])">
            <img
              src="assets/svg/not-available.svg"
              class="notPreview"
              alt=""
            />
          </ng-container>

          <img *ngIf="checkDocumentType(doc.name).uploaded || categorizedDocuments[doc.documentType]?.length > 0 "
            src="assets/svg/available.svg"
            alt=""
            class="notPreview"
          />
          <div class="flex flex-col space-y-0.5">
                    <span
                      class="text-not-black text-body_title leading-body_title font-semibold"
                    >{{ doc.name }}</span
                    >
            <span
              class="{{
                        checkDateIsExpiredOrNot(
                          categorizedDocuments[doc.documentType][categorizedDocuments[doc.documentType]?.length - 1]?.expiryDate
                        ).isExpired
                          ? 'text-red'
                          : 'text-not-black'
                      }} text-body" *ngIf="doc?.expiryAvailable"
            >{{ checkDateIsExpiredOrNot(categorizedDocuments[doc.documentType][categorizedDocuments[doc.documentType]?.length - 1]?.expiryDate).text }}</span>

          </div>
        </div>


        <div class="flex space-x-4 items-center">
          <div class="relative w-[3rem] h-[2.25rem]" *ngIf="categorizedDocuments[doc.documentType]?.length > 0 || checkDocumentType(doc.name).uploaded">
            <div class="w-[2.5rem] h-[1.875rem] bg-disabled absolute top-2 left-2 rounded-sm border border-blue">
            </div>
            <div class="w-[2.5rem] h-[1.875rem] absolute bg-white top-1 left-1 rounded-sm border border-blue">
            </div>
            <div class="w-[2.5rem] h-[1.875rem] rounded-sm border border-blue absolute top-0 left-0 overflow-hidden">
              <img *ngIf="!isPdf(categorizedDocuments[doc.documentType][0]?.fileUrl) && !isPdfFromAdded((checkDocumentType(doc.name).fileType))" (click)="viewSpecificDocument(categorizedDocuments[doc.documentType])"  [src]="categorizedDocuments[doc.documentType][0] ? categorizedDocuments[doc.documentType][0]?.preSignedFileUrl : (checkDocumentType(doc.name).preview | fallbackImage)" alt=""
                   class="w-full h-full object-cover notPreview" />
              <img *ngIf="isPdf(categorizedDocuments[doc.documentType][0]?.fileUrl) || isPdfFromAdded((checkDocumentType(doc.name).fileType))" (click)="viewSpecificDocument(categorizedDocuments[doc.documentType])" src="assets/svg/pdf.svg" alt="" class="w-full h-full object-cover notPreview" />
            </div>
          </div>
          <span *ngIf="(categorizedDocuments[doc.documentType]?.length === 0 || !categorizedDocuments[doc.documentType]) && !isInEditMode && !checkDocumentType(doc.name).uploaded && !fromAddDocument" class="text-web-text-secondary text-body"
          >Not uploaded yet</span>
          <ng-container *ngIf="isInEditMode || fromAddDocument">
            <ng-container *ngIf="shouldShowUploadButton(doc)">
              <app-upload-button
                (click)="triggerFileUpload(doc.documentType, doc?.max, doc.multiple, doc.expiryAvailable)"
                [file]="getFileOrNot(doc)"
                [icon]="getUploadIcon(doc)"
                [buttonText]="getUploadButtonText(doc)">
              </app-upload-button>
            </ng-container>

            <input
              type="file"
              #fileInput
              accept=".png, .jpg, .jpeg, .pdf"
              style="display: none"
              (change)="onFileSelected($event)"/>
          </ng-container>
        </div>
      </div>
    </ng-container>
  </div>
</div>
