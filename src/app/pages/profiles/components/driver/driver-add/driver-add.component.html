<div class="m-2 bg-white">
  <div class="p-4 border-b-2 border-input flex justify-between items-center">
    <h1 class="text-h1 leading-h1 font-semibold">Add New Driver</h1>
    <div>
      <button
        (click)="onDriverSave()"
        class="px-4 py-2 text-white bg-primary rounded-lg text-center font-semibold">
        <span>Save</span>
      </button>
    </div>
  </div>
  <form [formGroup]="driverAddForm">
    <div class="grid lg:grid-cols-2 text-body">
      <div class="w-full border-r-2 border-input">
        <div class="p-4 flex flex-col space-y-3">
          <div class="flex space-x-3 items-center text-not-black">
            <img loading="lazy" src="assets/svg/user.svg" alt="" />
            <span class="text-h2 leading-h2 font-semibold">Driver Info</span>
          </div>
          <div class="grid gap-3">
            <div class="flex flex-col space-y-1">
              <label for="driverName" class="text-not-black font-semibold">Name</label>
              <div>
                <mat-form-field appearance="outline" class="example-full-width w-full">
                  <input
                    appAlphabetOnly
                    id="driverName"
                    [minLength]="2"
                    [maxLength]="50"
                    type="text"
                    matInput
                    formControlName="driverName"
                    placeholder="Enter driver Name">
                </mat-form-field>
                <span
                  *ngIf="driverAddForm.get('driverName').touched"
                  class="text-red text-xs"
                >{{ getDriverNameError() }}</span
                >
              </div>
            </div>
            <div class="flex flex-col space-y-2 w-full">
              <ngx-material-intl-tel-input [includeDialCode]="false" #numberInput class="customize" id="phoneNumber"
                                           [textLabels]="textLabels"
                                           [autoSelectedCountry]="CountryISO.Bangladesh"
                                           [preferredCountries]="[CountryISO.Bangladesh]"
                                           [fieldControl]="phoneNumber"
                                           [numberValidation]="true" [hidePhoneIcon]="true"
                                           [required]="true" [autoIpLookup]="false"></ngx-material-intl-tel-input>
              <!--        error-message-->
            </div>
          </div>
        </div>
      </div>
      <div class="w-full p-4 flex flex-col space-y-3">
        <div class="flex justify-between items-center h-8">
          <div class="text-not-black flex space-x-3 items-center">
            <img loading="lazy" src="assets/svg/document.svg" alt="" />
            <span>Documents</span>
          </div>
        </div>
        <div>
          <app-file-upload
            [fileTypeOptions]="driverFileType"
            (fileInput)="onAddFile($event)"
            padding="0"
            [isUploadIconEnabled]="false"></app-file-upload>
        </div>
      </div>
    </div>
  </form>
</div>
