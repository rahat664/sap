<div class="p-4 flex flex-col space-y-3">
  <div
    appGetElementHeight
    (height)="height = $event"
    class="flex flex-col space-y-3">
    <div
      class="flex flex-col space-y-3 lg:space-y-0 lg:flex-row justify-between">
      <h1 class="text-h1 font-semibold">Driver</h1>
      <div class="flex space-x-4 items-center">
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="far fa-search text-gray-500"></i>
          </div>
          <input
            (keyup)="onKeyUpSearch($event)"
            type="text"
            name="email"
            id="topbar-search"
            class="border-none text-input-hint w-[24rem] bg-white sm:text-sm rounded-lg focus:ring-cyan-600 focus:border-cyan-600 block pl-10 p-2.5"
            placeholder="Search name, mobile" />
        </div>
        <button
          routerLink="/profile/driver/add"
          class="px-4 flex space-x-4 items-center py-3 lg:py-2 bg-primary text-white rounded-lg">
          <i class="fas fa-plus-circle"></i>
          <span class="hidden lg:block">Add New Driver</span>
        </button>
      </div>
    </div>
  </div>
  <div
    appGiveMaxHeight
    (inBottomEnd)="onBottom($event)"
    [totalPage]="totalPages"
    [anotherItemsHeight]="height"
    appCheckTheHeightCrossMaxHeightOrNot
    (maxHeightCrossed)="onMaxHeightCross($event)"
    class="bg-white w-full rounded-lg overflow-auto relative">
    <table class="table-auto w-full text-[0.875rem]">
      <thead>
        <tr class="whitespace-nowrap bg-white">
          <th class="text-left">Driver Name</th>
          <th class="text-left">Mobile Number</th>
          <th class="text-left">No. of trip</th>
          <th class="text-center">Driving License</th>
          <th class="text-center">National ID</th>
          <th class="text-left">Status</th>
          <!--        <th style="width: 5%"></th>-->
        </tr>
        <tr>
          <th class="border" colspan="6"></th>
        </tr>
      </thead>
      <tbody class="text-web-text-secondary">
        <ng-container *ngIf="!loading">
          <tr *ngFor="let driver of driverList">
            <td class="whitespace-nowrap">
              <div class="flex items-center space-x-4">
                <div
                  class="w-8 h-8 rounded-full bg-another flex items-center justify-center">
                  <span class="text-white font-bold capitalize">{{
                    driver.name[0]
                  }}</span>
                </div>
                <a
                  (click)="onClickDriverName(driver)"
                  routerLink="/profile/driver/{{ driver.id }}/details"
                  class="flex-1 text-link cursor-pointer"
                  >{{ driver.name }}</a
                >
              </div>
            </td>
            <td>
              {{ driver.phone }}
            </td>
            <td>{{ driver.completedTripCountsForDriver }}</td>
            <td class="whitespace-nowrap">
              <div class="flex items-center justify-center h-full">
                <i
                  *ngIf="
                    driver.driverFilesUrls?.drivingLicenseBack ||
                    driver.driverFilesUrls?.drivingLicenseFront
                  "
                  class="fas fa-check text-green"></i>
                <app-upload-button
                  (click)="onClickLicenseUpload(driver)"
                  *ngIf="
                    !driver.driverFilesUrls?.drivingLicenseBack &&
                    !driver.driverFilesUrls?.drivingLicenseFront
                  "
                  icon="upload"
                  [file]="true"
                  buttonText="Upload"></app-upload-button>
              </div>
            </td>
            <td class="whitespace-nowrap">
              <div class="flex items-center justify-center h-full">
                <i
                  *ngIf="
                    driver.driverFilesUrls?.nidFront ||
                    driver.driverFilesUrls?.nidBack
                  "
                  class="fas fa-check text-green"></i>
                <app-upload-button
                  (click)="onClickNidUpload(driver)"
                  *ngIf="
                    !driver.driverFilesUrls?.nidBack &&
                    !driver.driverFilesUrls?.nidFront
                  "
                  icon="upload"
                  [file]="true"
                  buttonText="Upload"></app-upload-button>
              </div>
            </td>
            <td class="whitespace-nowrap">
              <span
                class="{{ driver.enabled ? 'text-not-black' : 'text-red' }}"
                >{{ driver.enabled ? 'Approved' : 'Pending' }}</span
              >
            </td>
            <!--          <td>-->
            <!--            <i class="fas fa-ellipsis-v"></i>-->
            <!--          </td>-->
          </tr>
        </ng-container>
        <ng-container *ngIf="!loading">
          <tr *ngIf="driverList?.length === 0">
            <td class="text-center" colspan="6">No data found</td>
          </tr>
        </ng-container>
        <ng-container *ngIf="loading">
          <tr>
            <td class="h-full" colspan="6">
              <app-loading></app-loading>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>
<app-create-popup
  (isModalClosed)="isOpen = !$event; isNewOpen = !$event"
  [isOpen]="isOpen">
  <app-file-upload-popup
    [singleDriver]="singleDriver"
    [callFromModal]="true"
    [isNewOpen]="isNewOpen"
    [fileTypeOptions]="newDriverFileType"
    [isFromDriver]="true"></app-file-upload-popup>
</app-create-popup>
