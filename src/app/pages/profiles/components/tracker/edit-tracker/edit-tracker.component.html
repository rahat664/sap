<div class="m-2 bg-white">
  <div class="p-4 border-b-2 border-input flex justify-between items-center">
    <h1 class="text-h1_mobile leading-h1_mobile lg:text-h1 lg:leading-h1 font-semibold">Edit Tracker</h1>
    <div>
      <button
        (click)="onTrackerSave()"
        class="px-4 lg:px-12 py-2 text-white bg-primary rounded-lg text-center font-semibold">
        <span class="hidden lg:inline">Update</span>
        <i class="fas fa-save lg:hidden"></i>
      </button>
    </div>
  </div>
  <form [formGroup]="trackerAddForm">
    <div class="grid lg:grid-cols-2 text-body">
      <div class="w-full border-r border-line p-4">
        <div class="flex space-x-3 items-center">
          <img src="assets/svg/vendor.svg" alt="" class="notPreview"/>
          <span class="text-h2 leading-h2 font-semibold">Vendor Info</span>
        </div>
        <div class="grid lg:grid-cols-2 gap-3">
          <div class="flex flex-col space-y-1 lg:col-span-2 py-4">
            <label class="text-not-black font-semibold">Vendor Name</label>
            <mat-form-field #disableVendorSelect appearance="outline">
              <mat-select
                formControlName="vendorId"
                (selectionChange)="onChangeVendorType($event)"
                placeholder="Select Vendor">
                @for (vendor of vendorList; track vendor) {
                  <mat-option [value]="vendor.id">{{ vendor.name }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div>
          <div class="flex flex-col space-y-1 lg:col-span-2">
            <label class="text-not-black font-semibold">Tracker Id</label>
            <mat-form-field appearance="outline">
              <input
                readonly
                formControlName="trackerId"
                matInput
                placeholder="Enter tracker ID"
                class="w-full p-4 rounded-lg outline-none ring-none border-none bg-input"/>
            </mat-form-field>
          </div>
          <div class="flex flex-col space-y-1">
            <label class="text-not-black font-semibold">Type</label>
            <mat-form-field #disableSelect appearance="outline">
              <mat-select
                formControlName="trackerType"
                placeholder="Select Type">
                <mat-option value="WIRED">Wired</mat-option>
                <mat-option value="PORTABLE">Portable</mat-option>
              </mat-select>
            </mat-form-field>
          </div>
        </div>
      </div>
      <div class="w-full p-4">
        <div class="flex flex-col space-y-3">
          <div class="flex space-x-3 items-center">
            <img src="assets/svg/truckinfo.svg" alt="" class="notPreview"/>
            <span class="text-h2 leading-h2 font-semibold"
            >Assign Truck (optional)</span
            >
          </div>
          <div class="flex flex-col space-y-1">
            <label class="text-not-black font-semibold"
            >Truck Registration Number</label
            >
            <mat-form-field
              appearance="outline"
              class="example-full-width w-full">
              <input
                id="transporterName"
                type="text"
                matInput
                formControlName="truckRegNo"
                (keyup)="onKeyUpTruckSearch($event)"
                placeholder="Enter Truck Registration Number"
                [matAutocomplete]="truck"/>
              <mat-autocomplete #truck="matAutocomplete">
                @for (option of truckSuggestion; track option) {
                  <mat-option
                    (click)="onClickTruckSearchSuggestion(option)"
                    [value]="option.fullRegistrationNumber">
                    <div class="flex flex-col space-y-1">
                      <span
                        class="text-body_title leading-body_title text-not-black font-semibold"
                      >{{ option.fullRegistrationNumber }}</span
                      >
                    </div>
                  </mat-option>
                }
              </mat-autocomplete>
            </mat-form-field>
          </div>
        </div>
      </div>
    </div>
  </form>
</div>
