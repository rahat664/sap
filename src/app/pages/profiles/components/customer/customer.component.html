<div class="p-4 flex flex-col space-y-3">
  <div appGetElementHeight (height)="height = $event" class="flex flex-col space-y-3">
    <div class="flex flex-col space-y-3 lg:space-y-0 lg:flex-row justify-between">
      <h1 class="text-h1 font-semibold">Customer</h1>
      <div class="flex space-x-4 items-center">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="far fa-search text-gray-500"></i>
          </div>
          <input type="text" name="email" id="topbar-search"
                 class="border-none text-input-hint w-[24rem] bg-white  sm:text-sm rounded-lg focus:ring-cyan-600 focus:border-cyan-600 block pl-10 p-2.5"
                 placeholder="Search  name, mobile, email">
        </div>
        <button (click)="onClickAddCustomer()" class="px-4 flex space-x-4 items-center py-3 lg:py-2 bg-primary text-white rounded-lg">
          <i class="fas fa-plus-circle"></i>
          <span class="hidden lg:block">Add Customer</span>
        </button>
      </div>
    </div>
    <div class=" w-full bg-white rounded-lg">
      <button (click)="filterOpened = !filterOpened" class="flex  px-2 py-1 space-x-3 items-center w-full "
              [ngClass]="{'border-b-2 border-[#0CD5F0]': filterOpened}">
        <i class="fas fa-caret-down text-input-hint text-xl"></i>
        <span class="text-not-black text-[0.875rem]">Filter
        <span *ngIf="getFilterLength() > 0">({{ statusFilter + roleFilter }})</span>
        <span *ngIf="getFilterLength() > 0" class="text-input-hint px-3">|</span>
        <a (click)="onClearFilter()" *ngIf="getFilterLength() > 0" class="text-red">Clear all</a>
      </span>
      </button>
      <div *ngIf="filterOpened" class="p-4 flex items-center space-x-3">

      </div>
    </div>
  </div>
  <div appGiveMaxHeight [anotherItemsHeight]="height" class="bg-white relative w-full rounded-lg overflow-auto">
    <table class="table-auto w-full text-[0.875rem]">
      <thead>
        <tr class="whitespace-nowrap bg-white">
          <th class="text-left">Company name</th>
          <th class="text-center">Customer code</th>
          <th class="text-left">Contact person</th>
          <th class="text-left">Mobile</th>
          <th class="text-left">Email</th>
          <th class="text-left">Address</th>
          <th style="width: 5%"></th>
        </tr>
        <tr>
          <th class="border" colspan="7"></th>
        </tr>
      </thead>
      <tbody class="text-web-text-secondary ">
        <ng-container *ngIf="!loading">
          <tr *ngFor="let customer of customers">
            <td class="whitespace-nowrap">
              <div class="flex items-center space-x-4">
                <div class="w-8 h-8 rounded-full bg-blue flex items-center justify-center">
                  <span class="text-white font-bold capitalize">{{customer.name[0]}}</span>
                </div>
                <span class="flex-1">{{customer.name}}</span>
              </div>
            </td>
            <td class="text-center">{{customer.customerCode}}</td>
            <td>
              <ng-container *ngFor="let user of customer?.user">
                <span>{{user?.name}}</span>
              </ng-container>
            </td>
            <td>{{customer.phone}}</td>
            <td>{{customer.email}}</td>
            <td>{{ customer.address }}</td>
            <td>
              <i class="fas fa-ellipsis-v"></i>
            </td>
          </tr>
        </ng-container>
        <ng-container *ngIf="!loading">
          <tr *ngIf="customers.length === 0">
            <td class="text-center" colspan="7">No data found</td>
          </tr>
        </ng-container>
        <ng-container *ngIf="loading">
          <tr>
            <td class="h-full" colspan="7">
              <app-loading></app-loading>
            </td>
          </tr>
        </ng-container>
      </tbody>
    </table>
  </div>
</div>
<app-create-popup (isModalClosed)="isOpen = !$event" [isOpen]="isOpen">
  <app-customer-create (formCreated)="onCreateCustomer($event)"></app-customer-create>
</app-create-popup>
