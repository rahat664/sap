<div class="bg-white p-4 rounded-lg mt-4">
  <div class="flex space-x-3 items-center mb-4">
    <img src="assets/svg/contact-person.svg" class="notPreview">
    <h3 class="text-h2 leading-h2 text-not-black font-semibold">Contact Persion</h3>
  </div>

  <div class="grid md:grid-cols-2 gap-4">
    <div class="flex flex-col space-y-1">
      <p class="text-body  text-web-text-secondary">Name</p>
      <p class="text-body_title font-semibold leading-body_title text-not-black">{{ contact.name }}</p>
    </div>
    <div class="flex flex-col space-y-1">
      <p class="text-body  text-web-text-secondary">Email</p>
      <p class="text-body_title font-semibold leading-body_title text-not-black">{{ contact.email }}</p>
    </div>
    <div class="flex flex-col space-y-1">
      <p class="text-body  text-web-text-secondary">Mobile no.</p>
      <p class="text-body_title font-semibold leading-body_title text-not-black">{{ contact.phone }}</p>
    </div>
  </div>
</div>
