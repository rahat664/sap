<div
  class="fixed top-0 right-0 w-[26rem] bg-white  h-full flex flex-col z-50 shadow-lg justify-between px-8 pb-6 overflow-auto transform transition-transform translate-x-0">
  <div class="flex flex-col justify-between h-full">
    <div
      class="flex flex-col">
      <div class="flex items-center justify-between py-6 sticky top-0">
        <h2 class="text-h3 leading-h3 font-semibold">Filters</h2>
        <button (click)="onClose()" class="text-not-black hover:text-black">
          <i class="fal fa-times text-xl text-primary"></i>
        </button>
      </div>

      <div class="w-full flex flex-col space-y-3">
        <div class="flex-col space-y-2 flex w-full">
          <label class="text-base text-secondary">Date</label>
          <div class="flex flex-wrap gap-2">
            <ng-container *ngFor="let button of buttonName">
              <button
                type="button"
                (click)="onClickFilterButton(button, picker)"
                class="px-2 py-1   {{
                    selectedButton === button
                      ? 'border-none bg-green text-white'
                      : 'border border-input-hint text-secondary'
                  }}  font-semibold text-body self-end rounded-full">
                <span>{{ button }}</span>
              </button>
            </ng-container>
          </div>
          <mat-date-range-picker #picker></mat-date-range-picker>
          <ng-container *ngIf="dateText || customDateText || customSelected">
            <mat-form-field (mouseenter)="updateOverLayStyle(false)" appearance="outline" class="filter">
              <mat-date-range-input [rangePicker]="picker">
                <input
                  [disabled]="!customSelected"
                  (focus)="picker.open()"
                  [(ngModel)]="startDate"
                  (selectionchange)="onChangeStartDate($event)"
                  matStartDate
                  placeholder="Start Date"/>
                <input
                  [disabled]="!customSelected"
                  (focus)="picker.open()"
                  [(ngModel)]="endDate"
                  (selectionchange)="onChangeEndDate($event)"
                  matEndDate
                  placeholder="End Date"/>
              </mat-date-range-input>
              <mat-datepicker-toggle
                matIconSuffix
                [for]="picker"></mat-datepicker-toggle>
            </mat-form-field>
          </ng-container>
        </div>
      </div>
    </div>
    <div class="w-full " >
      <button class="bg-primary text-white rounded-lg py-2 font-semibold w-full" (click)="onApplyFilter()">Apply Filter
      </button>
    </div>
  </div>
</div>
