<ng-container *ngIf="!dateSelection">
  <div class="flex justify-between w-full items-center px-4 py-4 pb-4 sticky top-0">
    <h2 class="text-h3 leading-h3 font-semibold">Choose Truck</h2>
    <button
      (click)="onClose()">
      <i class="fal fa-times"></i>
    </button>
  </div>
  <div class="px-4">
    <div *ngFor="let truck of truckList">
      <div>
        <mat-checkbox (change)="onChange($event, truck)"
                      class="example-margin">{{ truck?.vehicleRegistrationNumber }}
        </mat-checkbox>
      </div>
    </div>
  </div>
  <div>
    <button
      (click)="onSelectTruck()"
      class="px-4 mr-4 mb-4 flex space-x-4 float-end items-center py-3 lg:py-2 bg-primary text-white rounded-lg">
      <span class="hidden lg:block">Select Truck</span>
    </button>
  </div>
</ng-container>

<ng-container *ngIf="dateSelection">
  <div class="flex justify-between w-full items-center px-4 py-4 pb-4 sticky top-0">
    <h2 class="text-h3 leading-h3 font-semibold">Choose Date</h2>
    <button
      (click)="onClose()">
      <i class="fal fa-times"></i>
    </button>
  </div>
  <div class="min-w-96 px-4">
    <div class="flex items-center w-full h-full">
      <div class="flex w-full flex-col space-y-3">
        <div class="flex flex-col space-y-1">
          <label class="font-semibold" for="fromDate">From</label>

          <div id="fromDate" class="grid grid-cols-3 gap-4">
            <ng-select
              [appendTo]="'body'"
              [searchable]="false"
              [clearable]="false"
              placeholder="Month"
              [ngModel]="selectedFromMonthInString"
              (ngModelChange)="onFromMonthChange($event)">
              <ng-option *ngFor="let month of months" [value]="month">{{
                  month
                }}
              </ng-option>
            </ng-select>
            <ng-select
              [appendTo]="'body'"
              [searchable]="false"
              [clearable]="false"
              placeholder="Day"
              [ngModel]="selectedFromDay"
              (ngModelChange)="onFromDayChange($event)">
              <ng-option *ngFor="let day of days" [value]="day">{{
                  day
                }}
              </ng-option>
            </ng-select>
            <ng-select
              [appendTo]="'body'"
              [searchable]="false"
              [clearable]="false"
              placeholder="Year"
              [ngModel]="selectedFromYear"
              (ngModelChange)="onFromYearChange($event)">
              <ng-option *ngFor="let year of years" [value]="year">{{
                  year
                }}
              </ng-option>
            </ng-select>
          </div>
        </div>

        <div class="flex flex-col space-y-1">
          <label class="font-semibold" for="toDate">To</label>
          <div id="toDate" class="grid grid-cols-3 gap-4">
            <ng-select
              [appendTo]="'body'"
              [searchable]="false"
              [clearable]="false"
              placeholder="Month"
              [ngModel]="selectedToMonthInString"
              (ngModelChange)="onToMonthChange($event)">
              <ng-option *ngFor="let month of months" [value]="month">{{
                  month
                }}
              </ng-option>
            </ng-select>
            <ng-select
              [appendTo]="'body'"
              [searchable]="false"
              [clearable]="false"
              placeholder="Day"
              [ngModel]="selectedToDay"
              (ngModelChange)="onToDayChange($event)">
              <ng-option *ngFor="let day of days" [value]="day">{{
                  day
                }}
              </ng-option>
            </ng-select>
            <ng-select
              [appendTo]="'body'"
              [searchable]="false"
              [clearable]="false"
              placeholder="Year"
              [ngModel]="selectedToYear"
              (ngModelChange)="onToYearChange($event)">
              <ng-option *ngFor="let year of years" [value]="year">{{
                  year
                }}
              </ng-option>
            </ng-select>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div>
    <button
      (click)="onGenerateReport()"
      class="px-4 mr-4 my-4 float-end flex space-x-4 items-center py-3 lg:py-2 bg-primary text-white rounded-lg">
      <i class="fas fa-file-pdf"></i>
      <span class="hidden lg:block">Generate</span>
    </button>
  </div>
</ng-container>
