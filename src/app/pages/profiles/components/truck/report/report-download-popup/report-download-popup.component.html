<div class="flex h-[60vh] flex-col space-y-8">
  <div class="flex justify-between gap-8 items-center px-4 py-2 border-b border-line">
    <h1 class="text-h1 font-semibold">{{ data.heading }}.pdf</h1>
    <button type="button" (click)="closeModal()" class="p-1 h-4 w-4 flex items-center justify-center">
      <i class="fal fa-times"></i>
    </button>
  </div>
  <div class="h-full w-full flex items-center justify-center">
    <div class="flex flex-col justify-center space-y-4 items-center">
      <img class="w-[152px] h-[152px]" src="./assets/svg/pdf.svg">
      <p class="text-body_title text-center leading-body_title text-secondary font-semibold w-2/3">Your report has been
        generated
        successfully.
        You can download it now.</p>
      <button type="button" (click)="downloadReport()" class="px-16 py-4 bg-primary text-white rounded-lg">
        <i class="fas fa-download mr-2"></i>
        <span>Download</span>
      </button>
    </div>
  </div>
</div>
