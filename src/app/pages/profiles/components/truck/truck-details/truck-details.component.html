<div class="m-2 bg-white">
  <div class="p-4 border-b-2 border-input flex justify-between items-center">
    <h1 class="text-h1 font-semibold">Truck detail</h1>
    <div>
      <button (click)="inEditMode = !inEditMode" *ngIf="!inEditMode"
              class="w-8 h-8 bg-white flex items-center hover:bg-input justify-center">
        <i class="far fa-pen text-primary"></i>
      </button>
      <button (click)="inEditMode = !inEditMode" *ngIf="inEditMode"
              class="px-4 py-2 text-white bg-primary rounded-lg text-center font-semibold">
        <span>Save</span>
      </button>
    </div>
  </div>
  <div class="grid lg:grid-cols-2 text-body">
    <div class="w-full border-r-2 border-input">
      <div class="border-b-2 border-input p-4 flex flex-col space-y-3">
        <div class="flex space-x-3 items-center text-not-black">
          <img src="assets/svg/truckinfo.svg" alt="">
          <span class="text-h2 font-semibold">Truck Info</span>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div class="flex flex-col space-y-1" [ngClass]="{'col-span-2': inEditMode}">
            <span class="text-not-black font-semibold">Registration No.</span>
            <span *ngIf="!inEditMode" class="text-web-text-secondary">Dhaka Metro TA 127865</span>
            <div *ngIf="inEditMode" class="grid grid-cols-5 w-full gap-3">
              <app-custom-input class="w-full col-span-2"
                appGetClickEvent
                (clickedElement)="onClickRegistrationZone($event)"
                [options]="registrationZoneList"
                inputPlaceholder="Select Registration Zone"
                [itemsOpened]="registrationZoneOpened"
                (selectedId)="onSelectRegistrationZone($event)"
                [inputSearch]="registrationZonePlaceholder"
              ></app-custom-input>
              <app-custom-input class="w-full"
                appGetClickEvent
                (clickedElement)="onClickRegistrationType($event)"
                [options]="registrationListType"
                inputPlaceholder="Select Registration type"
                [itemsOpened]="registrationOpenedType"
                (selectedId)="onSelectRegistrationype($event)"
                [inputSearch]="registrationTypePlaceholder"
              ></app-custom-input>
              <input placeholder="Tracker Id"
                     class="w-full p-4 rounded-lg outline-none ring-none  border-none bg-input">
              <input placeholder="Tracker Id"
                     class="w-full p-4 rounded-lg outline-none ring-none  border-none bg-input">
            </div>
          </div>
          <div *ngIf="!inEditMode" class="flex flex-col space-y-1">
            <span class="text-not-black font-semibold">No. of trips</span>
            <span class="text-web-text-secondary">24</span>
          </div>

        </div>
      </div>
      <div class="border-b-2 border-input p-4">
        <div class="flex justify-between items-center">
          <div class="flex space-x-3 items-center text-not-black">
            <img src="assets/svg/list.svg" alt="">
            <span class="text-not-black font-semibold">Pre hire check list (16/22)</span>
          </div>
          <a class="text-link">Browse list</a>
        </div>
      </div>
      <div class="p-4 flex flex-col space-y-3">
        <div class="flex space-x-3 items-center text-not-black">
          <img src="assets/svg/trucker.svg" alt="">
          <span class="text-not-black font-semibold">Tracker info</span>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <ng-container *ngIf="!inEditMode">
            <div class="flex flex-col space-y-1">
              <span class="text-not-black font-semibold">Manufacturer</span>
              <span class="text-web-text-secondary">Traxnet</span>
            </div>
            <div class="flex flex-col space-y-1">
              <span class="text-not-black font-semibold">Tracker Id</span>
              <span class="text-web-text-secondary">127865</span>
            </div>
          </ng-container>
          <ng-container *ngIf="inEditMode">
            <div class="flex flex-col space-y-1">
              <span class="text-not-black font-semibold">Manufacturer</span>
              <app-custom-input
                appGetClickEvent
                (clickedElement)="onClickManufacturer($event)"
                [options]="manufacturerList"
                inputPlaceholder="Select Manufacturer"
                [itemsOpened]="manufactureOpened"
                (selectedId)="onSelectManuFacturer($event)"
                [inputSearch]="manufacturerPlaceholder"
              ></app-custom-input>
            </div>
            <div class="flex flex-col space-y-1">
              <span class="text-not-black font-semibold">Tracker Id</span>
              <input placeholder="Tracker Id"
                     class="w-full p-4 rounded-lg outline-none ring-none  border-none bg-input">
            </div>
          </ng-container>
        </div>
      </div>
    </div>
    <div class="w-full p-4 flex flex-col space-y-3">
      <div class="flex justify-between items-center h-8">
        <div class="text-not-black flex space-x-3 items-center">
          <img src="assets/svg/document.svg" alt="">
          <span>Documents</span>
        </div>
        <app-upload-button *ngIf="inEditMode" icon="upload" [file]="true"
                           buttonText="Upload"></app-upload-button>
      </div>
      <div class="grid grid-cols-4 gap-3">
        <div class="w-full flex flex-col space-y-1">
          <div class="p-4 rounded-lg border border-input relative">
            <img src="assets/images/dummy.jpg" alt="">
            <span *ngIf="inEditMode"
                  class="h-6 w-6 bg-red rounded-full flex justify-center items-center text-white absolute top-2 right-2">
              <i class="fas fa-times"></i>
            </span>
          </div>
          <div class="flex space-y-1 flex-col">
            <span class="text-web-text-secondary font-semibold">Registration</span>
            <span class="text-web-text-secondary">Exp:12/12/2022</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
