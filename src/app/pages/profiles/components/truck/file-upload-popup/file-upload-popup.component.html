<div class="flex flex-col space-y-4 justify-between p-{{ padding }} text-body">
  <button (click)="onClose()"
          class="absolute top-2 right-2 w-6 h-6 rounded-full bg-white flex items-center justify-center">
    <i class="fal fa-times text-primary"></i>
  </button>
  <div class="flex flex-col space-y-3">
    <div *ngIf="isUploadIconEnabled" class="flex space-x-3 items-center">
      <span
        class="h-6 w-6 rounded-full bg-input flex items-center justify-center">
        <img loading="lazy" class="notPreview" src="assets/svg/upload.svg" alt="" />
      </span>
      <h1 class="text-body font-bold">Upload documents</h1>
    </div>
    <label
      for="file-upload"
      class="drop-area {{isUploadDisabled ? 'border-input-hint': 'border-link'}} flex items-center space-y-3 flex-col w-full"
      (drop)="onFileDropped($event)"
      (dragover)="onDragOver($event)"
      (dragleave)="onDragLeave($event)">
      <svg width="71" height="52" viewBox="0 0 71 52" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path
          [ngStyle]="{ fill: isUploadDisabled ? '#D1D5DB' : '#56AAFF' }"
          d="M63.8182 0H7.09091C5.21028 0 3.40668 0.747076 2.07688 2.07688C0.747076 3.40668 0 5.21028 0 7.09091V42.5455C0.00124055 43.022 0.146507 43.4871 0.416741 43.8796C0.686975 44.2721 1.06955 44.5738 1.51428 44.7451C1.95901 44.9163 2.44512 44.9491 2.90883 44.8392C3.37254 44.7293 3.79219 44.4817 4.11273 44.1291L23.3764 22.6673L36.6127 41.7891C36.7957 42.0512 37.03 42.2735 37.3013 42.4425C37.5727 42.6115 37.8755 42.7237 38.1915 42.7723C38.5074 42.8209 38.83 42.8049 39.1396 42.7253C39.4492 42.6457 39.7394 42.5041 39.9927 42.3091L54.1745 31.46L66.8909 44.3891C67.2183 44.7106 67.6323 44.9298 68.0822 45.02C68.5321 45.1101 68.9986 45.0674 69.4246 44.897C69.8507 44.7266 70.2179 44.4358 70.4815 44.0602C70.7451 43.6846 70.8937 43.2404 70.9091 42.7818V7.09091C70.9091 5.21028 70.162 3.40668 68.8322 2.07688C67.5024 0.747076 65.6988 0 63.8182 0Z"
          fill="#56AAFF" />
        <path
          [ngStyle]="{ fill: isUploadDisabled ? 'gray' : '#0478ED' }"
          d="M70.2235 41.1273L56.0416 26.7091C55.6367 26.2997 55.0963 26.0522 54.5219 26.013C53.9474 25.9739 53.3784 26.1458 52.9216 26.4964L37.1325 38.6219C36.6541 38.9923 36.3359 39.5322 36.2435 40.1302C36.1512 40.7282 36.2917 41.3389 36.6362 41.8364L42.9707 50.9837C43.1879 51.2968 43.4776 51.5527 43.8151 51.7297C44.1526 51.9067 44.5279 51.9994 44.9089 52.0001H63.818C65.6986 52.0001 67.5022 51.253 68.832 49.9232C70.1618 48.5934 70.9089 46.7898 70.9089 44.9091V42.7819C70.9063 42.1618 70.6601 41.5676 70.2235 41.1273Z"
          fill="#0478ED" />
        <path
          [ngStyle]="{ fill: isUploadDisabled ? 'gray' : '#0478ED' }"
          d="M46.8474 48.2892L25.5746 17.5619C25.3718 17.2667 25.1046 17.0214 24.7931 16.8447C24.4817 16.6679 24.1341 16.5642 23.7767 16.5414C23.4192 16.5186 23.0613 16.5774 22.7299 16.7132C22.3985 16.8491 22.1023 17.0585 21.8637 17.3255L0.590995 40.9619C0.205557 41.3989 -0.00487921 41.9629 8.58981e-05 42.5455V44.9092C8.58981e-05 46.7898 0.747162 48.5934 2.07697 49.9232C3.40677 51.253 5.21037 52.0001 7.091 52.0001H44.9092C45.3404 51.9994 45.7632 51.8807 46.1318 51.657C46.5004 51.4332 46.8008 51.1129 47.0004 50.7307C47.2 50.3485 47.2913 49.919 47.2643 49.4886C47.2373 49.0583 47.0931 48.6435 46.8474 48.2892Z"
          fill="#0478ED" />
        <path
          d="M44.9089 21.2727C47.5197 21.2727 49.6362 19.1562 49.6362 16.5454C49.6362 13.9346 47.5197 11.8181 44.9089 11.8181C42.2981 11.8181 40.1816 13.9346 40.1816 16.5454C40.1816 19.1562 42.2981 21.2727 44.9089 21.2727Z"
          fill="white" />
      </svg>

      <div
        *ngIf="filePreview"
        class="h-64 w-64 overflow-hidden object-center object-cover">
        <img loading="lazy" class="h-full w-full" [src]="filePreview" alt="File Preview" />
      </div>
      <span class="text-sm font-medium {{isUploadDisabled ? 'text-input-hint' : 'text-web-text-secondary'}}"
      >Drop your image here or
        <a class="{{isUploadDisabled ? 'text-input-hint' : 'text-link'}} cursor-pointer text-decoration-underline"
        >browse</a
        ></span
      >

      <input
        type="file"
        id="file-upload"
        [disabled]="isUploadDisabled"
        (change)="onFileChange($event)"
        class="hidden w-full" />
    </label>
  </div>
  <div
    class="flex flex-col bg-input px-4 py-3 space-y-2 rounded-lg"
    *ngIf="fileArray.length > 0">
    <ng-container *ngFor="let file of fileArray; index as i">
      <div class="flex py-2 space-x-3 items-center">
        <div class="w-full flex justify-between gap-3 flex-1 items-center">
          <div class="h-12 w-12 overflow-hidden">
            <img
              class="h-full w-full"
              [src]="file.preview ? file.preview : 'assets/svg/fileupload.svg'"
              alt="" />
          </div>
          <div class="w-full grid gap-4"
               [ngClass]="{
            'grid-cols-2': file.registrationType === 'Case' ||
              file.registrationType === 'Fitness' ||
              file.registrationType === 'Route Permit' ||
              file.registrationType === 'Tax' ||
              file.registrationType === 'Driving License Front' || file.registrationType === 'Insurance'
            }"
          >
            <app-custom-input
              backgroundColor="white"
              inputPlaceholder="Select type"
              [options]="data?.filetype"
              (selectedId)="onSelectFileType($event, i)"
              [inputSearch]="file.registrationType"
            ></app-custom-input>
            <div
              *ngIf="
              file.registrationType === 'Case' ||
              file.registrationType === 'Fitness' ||
              file.registrationType === 'Route Permit' ||
              file.registrationType === 'Tax' ||
              file.registrationType === 'Driving License Front' ||file.registrationType === 'Insurance'"
            >
              <!--             Date picker cannot take previous date-->
              <mat-form-field class="example-full-width flex-1 w-full" appearance="outline" [ngClass]="{ 'error' : !file?.registrationExpireDate}">
                <input matInput [matDatepicker]="picker" placeholder="Expiry Date" (focusin)="picker.open()"
                       (selectionchange)="onDateChange($event, i)" >
                <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                <mat-datepicker #picker></mat-datepicker>
              </mat-form-field>
            </div>
          </div>
        </div>
        <button (click)="onCloseSelectedFile(i)"
                class="w-6 h-6 rounded-full bg-white flex items-center justify-center">
          <i class="fal fa-times text-primary"></i>
        </button>
      </div>
    </ng-container>
  </div>
  <button
    *ngIf="fileArray?.length > 0"
    (click)="onSubmit()"
    class="self-end bg-primary text-white rounded-lg px-4 py-2">
    Upload
  </button>
</div>
