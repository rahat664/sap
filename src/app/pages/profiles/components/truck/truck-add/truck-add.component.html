<div>
  <div class="p-2 sticky top-16 bg-app-bg z-30">
    <div class="p-4  rounded-lg bg-white flex justify-between items-center ">
      <h1 class="text-h1 leading-h1 font-semibold">Add New Truck</h1>
      <div>
        <button
          (click)="onClickSave()"
          class="px-[44px] py-[10.5px] text-white bg-primary rounded-lg text-center font-semibold">
          <i *ngIf="loading" class="fas fa-spinner fa-spin text-white mr-2"></i>
          <span>Save</span>
        </button>
      </div>
    </div>
  </div>
  <form [formGroup]="truckAddForm">
    <div class="grid lg:grid-cols-2 gap-3 px-2 text-body">
      <div class="w-full flex flex-col space-y-2">
        <div class="border-b-2 bg-white rounded-lg border-input px-6 py-5 flex flex-col space-y-3">
          <div class="flex space-x-4 items-center text-not-black">
            <img class="h-8 w-8" loading="lazy" src="assets/svg/truckinfo.svg" alt="" />
            <span class="text-h3 leading-h3 text-not-black font-semibold">Truck Info</span>
          </div>
          <div class="grid">
            <div class="flex flex-col space-y-1">
              <span class="text-not-black font-semibold">Registration Number</span>
              <div class="grid grid-cols-5 w-full gap-3">
                <div class="flex flex-col w-full col-span-2">
                  <app-custom-input
                    class="w-full"
                    appGetClickEvent
                    [isError]="registrationErrorMessage !== ''"
                    [errorMessage]="registrationErrorMessage"
                    (clickedElement)="onClickRegistrationZone($event)"
                    [options]="registrationZoneList"
                    inputPlaceholder="Zone"
                    (selectedId)="onSelectRegistrationZone($event)"
                    [inputSearch]="
                      registrationZonePlaceholder
                    "></app-custom-input>
                  <span class="text-red text-xs">{{
                      registrationErrorMessage
                    }}</span>
                </div>
                <div class="flex flex-col">
                  <app-custom-input
                    class="w-full"
                    appGetClickEvent
                    [isError]="registrationErrorMessage !== ''"
                    [errorMessage]="registrationCategoryErrorMessage"
                    (clickedElement)="onClickRegistrationType($event)"
                    [options]="registrationListType"
                    inputPlaceholder="Category"
                    (selectedId)="onSelectRegistrationType($event)"
                    [inputSearch]="
                      registrationTypePlaceholder
                    "></app-custom-input>
                  <span class="text-red text-xs">{{
                      registrationCategoryErrorMessage
                    }}</span>
                </div>
                <div class="flex flex-col w-full">
                  <mat-form-field appearance="outline" class="example-full-width ">
                    <input
                      id="registration_serial"
                      [minLength]="2"
                      [maxLength]="2"
                      type="text"
                      matInput
                      formControlName="registration_serial"
                      placeholder="Serial">
                  </mat-form-field>
                  <span
                    *ngIf="truckAddForm.get('registration_serial').touched && registrationSerialErrorMessage"
                    class="text-red text-xs"
                  >{{ registrationSerialErrorMessage }}</span
                  >
                </div>
                <div class="flex flex-col w-full">
                  <mat-form-field appearance="outline" class="example-full-width ">
                    <input
                      id="registration_num"
                      [minLength]="4"
                      [maxLength]="4"
                      type="text"
                      matInput
                      formControlName="registration_num"
                      placeholder="Number">
                  </mat-form-field>
                  <span
                    *ngIf="truckAddForm.get('registration_num').touched && registrationNumErrorMessage"
                    class="text-red text-xs"
                  >{{ registrationNumErrorMessage }}</span
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="px-6 py-5 flex flex-col space-y-3 bg-white rounded-lg">
          <div class="flex space-x-4 items-center">
            <img src="assets/svg/truckDocument.svg" class="notPreview" alt="truck document">
            <span class="text-not-black text-h3 leading-h3 font-semibold">Document</span>
          </div>
          <div class="flex flex-col space-y-1">
            <ng-container *ngFor="let option of truckFileType; index as i">
              <div class="flex justify-between items-center min-h-[4.25rem] bg-input rounded-lg pl-3 pr-6">
                <div class="flex space-x-4 items-center">
                  <img src="assets/svg/not-available.svg" class="notPreview" alt="" *ngIf="!option.uploaded">
                  <img src="assets/svg/available.svg" alt="" class="notPreview" *ngIf="option.uploaded">
                  <div class="flex flex-col space-y-0.5">
                    <span
                      class="text-not-black text-body_title leading-body_title font-semibold">{{ option.name }}</span>
                    <mat-form-field *ngIf="option?.expiryAvailable" class="example-full-width flex-1 custom"
                                    appearance="outline"
                                    [ngClass]="{ 'error' : truckAddForm.get(option.expiryFormControlName).invalid }"
                    >
                      <input [formControlName]="option.expiryFormControlName" matInput [matDatepicker]="picker"
                             placeholder="Expiry Date" (focusin)="picker.open()"
                             (selectionchange)="onDateChange($event, option.expiryFormControlName)">
                      <mat-datepicker-toggle matIconSuffix [for]="picker"></mat-datepicker-toggle>
                      <mat-datepicker #picker></mat-datepicker>
                    </mat-form-field>
                  </div>
                </div>

                <div class="flex space-x-6 items-center">
                  <div class="flex">
                    <div class="flex space-x-3 relative">
                      <div class="w-[2.75rem] h-[3.75rem] object-center border border-blue relative"
                           *ngFor="let file of getSpecificFiles(option?.formControlName)">
                        <img class="h-full w-full" [src]="file.preview" alt="">
                        <button (click)="onCloseImage(option?.formControlName, file)"
                                class="absolute -top-1 -right-2 bg-red flex justify-center items-center w-5 h-5 rounded-full text-white ">
                          <i class="far fa-times"></i>
                        </button>
                      </div>
                    </div>
                    <div *ngIf="getFileArray(option?.formControlName).length > 3">
                      <button [matMenuTriggerFor]="truckImagePop"
                              (click)="viewMoreFormControlName = option?.formControlName"
                              class="px-2 h-[3.75rem] flex text-link items-center justify-center bg-opacity-10 bg-blue
                              space-x-1  text-h2_medium font-semibold rounded-md">
                        <span
                          class="text-link font-semibold"
                        >+{{ getFileArray(option?.formControlName).length - 3 }}</span
                        >
                      </button>
                    </div>
                  </div>
                  <app-upload-button
                    *ngIf="getSpecificFiles(option?.formControlName)?.length === 0 || !getSpecificFiles(option?.formControlName)"
                    buttonText="Upload"
                    [file]="true"
                    (click)="triggerFileUpload(option?.formControlName, option.max)"
                    icon="upload"></app-upload-button>
                  <app-upload-button
                    *ngIf="getSpecificFiles(option?.formControlName)?.length > 0 && getSpecificFiles(option?.formControlName)?.length < option?.max"
                    (click)="triggerFileUpload(option?.formControlName, option.max)"
                    icon="plus"></app-upload-button>
                  <input [multiple]="option.multiple" type="file" #fileInput
                         style="display:none;" (change)="onFileSelected($event)" />
                </div>
              </div>
            </ng-container>
          </div>
        </div>
      </div>
      <div>
        <app-pre-hire-checklist (preHireCheckListObject)="onClickPrehiredChecklist($event)"></app-pre-hire-checklist>
      </div>
    </div>
  </form>
</div>

<!--<ng-template #truckImagePop>-->

<!--</ng-template>-->

<mat-menu #truckImagePop="matMenu" class="truck-menu">
  <div (click)="$event.stopPropagation()">
    <div class="flex justify-between items-center pl-6 pr-2 py-2">
      <h1 class="text-body_title leading-body_title text-not-black font-semibold">
        {{ getTruckImageTitle(viewMoreFormControlName) }}
      </h1>
      <button (click)="onClickClosePopUp(truckImagePop)" class="h-6 w-6 rounded-full hover:bg-input ">
        <i class="fal fa-times"></i>
      </button>
    </div>
    <div class="grid grid-cols-6 gap-3 px-6 py-4">
      <ng-container *ngFor="let file of getFileArray(viewMoreFormControlName)">
        <div class="w-[2.75rem] h-[3.75rem] object-center border border-blue relative"
        >
          <img (click)="onClickImage(file.preview)" class="h-full w-full" [src]="file.preview" alt="">
          <button (click)="onCloseImage('truckImages', file)"
                  class="absolute -top-1 -right-2 bg-red flex justify-center items-center w-5 h-5 rounded-full text-white ">
            <i class="far fa-times"></i>
          </button>
        </div>
      </ng-container>
    </div>
  </div>
</mat-menu>
