<div class="m-2 bg-white">
  <div class="p-4 border-b-2 border-input flex justify-between items-center">
    <h1 class="text-h1 font-semibold">Add New Truck</h1>
    <div>
      <button
        (click)="onClickSave()"
        class="px-4 py-2 text-white bg-primary rounded-lg text-center font-semibold">
        <span>Save</span>
      </button>
    </div>
  </div>
  <form [formGroup]="truckAddForm">
    <div class="grid lg:grid-cols-2 text-body">
      <div class="w-full border-r-2 border-input">
        <div class="border-b-2 border-input p-4 flex flex-col space-y-3">
          <div class="flex space-x-3 items-center text-not-black">
            <img loading="lazy" src="assets/svg/truckinfo.svg" alt="" />
            <span class="text-h2 font-semibold">Truck Info</span>
          </div>
          <div class="grid">
            <div class="flex flex-col space-y-1">
              <span class="text-not-black font-semibold">Registration Number</span>
              <div class="grid grid-cols-5 w-full gap-3">
                <div class="flex flex-col w-full col-span-2">
                  <app-custom-input
                    class="w-full"
                    appGetClickEvent
                    [isError]="registrationErrorMessage !== ''"
                    [errorMessage]="registrationErrorMessage"
                    (clickedElement)="onClickRegistrationZone($event)"
                    [options]="registrationZoneList"
                    inputPlaceholder="Zone"
                    (selectedId)="onSelectRegistrationZone($event)"
                    [inputSearch]="
                      registrationZonePlaceholder
                    "></app-custom-input>
                  <span class="text-red text-xs">{{
                      registrationErrorMessage
                    }}</span>
                </div>
                <div class="flex flex-col">
                  <app-custom-input
                    class="w-full"
                    appGetClickEvent
                    [isError]="registrationErrorMessage !== ''"
                    [errorMessage]="registrationCategoryErrorMessage"
                    (clickedElement)="onClickRegistrationType($event)"
                    [options]="registrationListType"
                    inputPlaceholder="Category"
                    (selectedId)="onSelectRegistrationType($event)"
                    [inputSearch]="
                      registrationTypePlaceholder
                    "></app-custom-input>
                  <span class="text-red text-xs">{{
                      registrationCategoryErrorMessage
                    }}</span>
                </div>
                <div class="flex flex-col w-full">
                  <mat-form-field appearance="outline" class="example-full-width ">
                    <input
                      id="registration_serial"
                      [minLength]="2"
                      [maxLength]="2"
                      type="text"
                      matInput
                      formControlName="registration_serial"
                      placeholder="Serial">
                  </mat-form-field>
                  <span
                    *ngIf="truckAddForm.get('registration_serial').touched && registrationSerialErrorMessage"
                    class="text-red text-xs"
                  >{{ registrationSerialErrorMessage }}</span
                  >
                </div>
                <div class="flex flex-col w-full">
                  <mat-form-field appearance="outline" class="example-full-width ">
                    <input
                      id="registration_num"
                      [minLength]="2"
                      [maxLength]="2"
                      type="text"
                      matInput
                      formControlName="registration_num"
                      placeholder="Number">
                  </mat-form-field>
                  <span
                    *ngIf="truckAddForm.get('registration_num').touched && registrationNumErrorMessage"
                    class="text-red text-xs"
                  >{{ registrationNumErrorMessage }}</span
                  >
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="border-b-2 border-input p-4">
          <div class="flex justify-between items-center">
            <div class="flex space-x-3 items-center text-not-black">
              <img loading="lazy" src="assets/svg/list.svg" alt="" />
              <span class="{{everyThingDisabled ? 'text-input-hint' : 'text-not-black'}} font-semibold"
              >Pre hire check list
              <span *ngIf="countPassCheckList">({{ countPassCheckList }}/22)</span>
              </span
              >
            </div>
            <button
              [disabled]="everyThingDisabled"
              (click)="onClickAddList()"
              class="{{everyThingDisabled ? 'text-input-hint' : 'text-link'}}"
            >{{ countPassCheckList ? 'Browse List' : 'Add List' }}
            </button
            >
          </div>
        </div>
      </div>
      <div class="w-full p-4 flex flex-col space-y-3">
        <div class="flex justify-between items-center h-8">
          <div class="text-not-black flex space-x-3 items-center">
            <img loading="lazy" src="assets/svg/document.svg" alt="" />
            <span>Documents</span>
          </div>
        </div>
        <app-file-upload
          [isUploadDisabled]="everyThingDisabled"
          (fileInput)="onAddFile($event)"
          [fileTypeOptions]="fileUpload"
          padding="0"
          [isUploadIconEnabled]="false"></app-file-upload>
      </div>
    </div>
  </form>
</div>
