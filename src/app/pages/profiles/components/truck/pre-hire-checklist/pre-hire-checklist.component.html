<div class="px-11 py-5 bg-white rounded-lg">
  <div class="flex space-x-2 items-center  pb-4">
    <img src="assets/svg/list.svg" class="notPreview h-[2rem] w-[2rem]" alt="">
    <h1 class="text-h3 leading-h3 font-semibold">Pre Hire Checklist</h1>
  </div>
  <div
    class=" overflow-auto w-full border-not-black overflow-x-hidden">
    <div class="rounded-lg bg-white table-auto w-full border border-line overflow-hidden">
      <div class="bg-input text-not-black font-semibold text-body_title leading-body_title top-0 ">
        <div class="px-4 py-3 grid grid-cols-7">
          <span class="col-span-4">Inspection Item</span>
          <div class="w-full flex justify-center items-center">Pass</div>
          <span class="w-full flex justify-center items-center">Fail</span>
          <span class="w-full flex justify-center items-center">N/A</span>
        </div>
      </div>
      <div class="px-4 flex flex-col py-2 space-y-2">
        <ng-container *ngFor="let items of preHireCheckList; index as i">
          <h1 class="text-not-black text-body_title leading-body_title font-semibold">{{ items.categoryName }}</h1>
          <div *ngFor="let item of items.items; index as j"
               class="text-body_title leading-body_title font-normal grid grid-cols-7 ">
            <div class="col-span-4 bg-[#FAFDFF] py-4 px-2"> {{ getChecklistPosition(i, j) }}. {{ item.name }}</div>
            <div class="w-full bg-[#FAFDFF] py-4 px-2 h-full flex justify-center items-center">
              <input
                (change)="onChange($event, item.id)"
                [checked]="item.status === 'PASS'"
                type="radio"
                name="{{ item.name }}"
                value="PASS" />
            </div>
            <div class="w-full bg-[#FAFDFF] py-4 px-2 h-full flex justify-center items-center">
              <input
                [checked]="item.status === 'FAIL' || item.status == ''"
                (change)="onChange($event, item.id)"
                type="radio"
                name="{{ item.name }}"
                value="FAIL" />
            </div>
            <div class="w-full bg-[#FAFDFF] py-4 px-2 h-full flex justify-center items-center">
              <input
                [checked]="item.status === 'NA'"
                (change)="onChange($event, item.id)"
                type="radio"
                name="{{ item.name }}"
                value="NA" />
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
