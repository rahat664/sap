<div class="p-4 flex flex-col space-y-3">
  <div appGetElementHeight (height)="height = $event" class="flex flex-col space-y-3">
    <div class="flex flex-col space-y-3 lg:space-y-0 lg:flex-row justify-between">
      <h1 class="text-h1 font-semibold">Truck</h1>
      <div class="flex space-x-4 items-center">
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="far fa-search text-gray-500"></i>
          </div>
          <input type="text" name="email" id="topbar-search"
                 class="border-none text-input-hint w-[24rem] bg-white  sm:text-sm rounded-lg focus:ring-cyan-600 focus:border-cyan-600 block pl-10 p-2.5"
                 placeholder="Enter truck registration number">
        </div>
        <button routerLink="/profile/truck/add"
                class="px-4 flex space-x-4 items-center py-3 lg:py-2 bg-primary text-white rounded-lg">
          <i class="fas fa-plus-circle"></i>
          <span class="hidden lg:block">Add Truck</span>
        </button>
      </div>
    </div>
  </div>
  <div appGiveMaxHeight [anotherItemsHeight]="height" class="bg-white w-full rounded-lg overflow-auto relative">
    <table class="table-auto w-full text-[0.875rem]">
      <thead>
      <tr class="whitespace-nowrap bg-white">
        <th class="text-left">Registration number</th>
        <th class="text-left">Pre-hire checklist</th>
        <th class="text-left">No. of trip</th>
        <th class="text-center">Tracker</th>
        <th class="text-center">Registration</th>
        <th class="text-center">Truck fitness</th>
        <th class="text-center">Route permit</th>
        <th class="text-center">Other Document</th>
        <th style="width: 5%"></th>
      </tr>
      <tr>
        <th class="border" colspan="9"></th>
      </tr>
      </thead>
      <tbody class="text-web-text-secondary">
      <tr *ngFor="let truck of truckList">
        <td class="whitespace-nowrap">
          <div class="flex items-center space-x-4">
            <div class="w-8 h-8 rounded-full bg-another flex items-center justify-center">
              <span class="text-white font-bold capitalize">{{ truck.registration_zone[0] }}</span>
            </div>
            <a routerLink="/profile/truck/{{ truck.id }}/details"
               class="flex-1 text-link cursor-pointer">{{ getFullRegistrationName(truck) }}</a>
          </div>
        </td>
        <td class="text-center">
          <a routerLink="/profile/truck/{{ truck.id }}/pre-hire-checklist"
             class="text-link cursor-pointer">{{ truck.preHireChecklist }}</a>
        </td>
        <td class="text-center">{{ truck.numberOfTrips }}</td>
        <td class="text-center whitespace-nowrap">
          <div class="flex items-center justify-center h-full">
            <span *ngIf="truck.tracker">{{ truck.tracker }}</span>
            <app-upload-button (click)="onClickAddTracker(truck.id)" *ngIf="!truck.tracker" icon="plus" [file]="false"
                               buttonText="Add Tracker"></app-upload-button>
          </div>
        </td>
        <td class="whitespace-nowrap">
          <div class="flex items-center justify-center h-full">
            <i *ngIf="truck.regPaperFile" class="fas fa-check text-green"></i>
            <app-upload-button (click)="isOpen = true" *ngIf="!truck.regPaperFile" icon="upload" [file]="true"
                               buttonText="Upload"></app-upload-button>
          </div>
        </td>
        <td class="whitespace-nowrap">
          <div class="flex items-center justify-center h-full">
            <i *ngIf="truck.fitnessFile" class="fas fa-check text-green"></i>
            <app-upload-button *ngIf="!truck.fitnessFile" icon="upload" [file]="true"
                               buttonText="Upload"></app-upload-button>
          </div>
        </td>
        <td class="whitespace-nowrap">
          <div class="flex items-center justify-center h-full">
            <i *ngIf="truck.routePermitFile" class="fas fa-check text-green"></i>
            <app-upload-button *ngIf="!truck.routePermitFile" icon="upload" [file]="true"
                               buttonText="Upload"></app-upload-button>
          </div>
        </td>
        <td class="whitespace-nowrap">
          <div class="flex items-center justify-center h-full">
            <i *ngIf="truck.otherFile || truck.taxFile || truck.caseFile" class="fas fa-check text-green"></i>
            <app-upload-button *ngIf="!truck.otherFile && !truck.taxFile && !truck.caseFile" icon="upload" [file]="true"
                               buttonText="Upload"></app-upload-button>
          </div>
        </td>
        <td>
          <i class="fas fa-ellipsis-v"></i>
        </td>
      </tr>
      <div *ngIf="trackerAddOpened"
        class="custom-border flex flex-col space-y-4 p-4 bg-white rounded-lg absolute top-1/3 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
        <div class="flex justify-between">
          <div class="flex space-x-3 items-center">
            <img src="assets/svg/trucker.svg" alt="tracker">
            <h3 class="text-body font-semibold">Tracker Info</h3>
          </div>
          <a class="cursor-pointer" (click)="trackerAddOpened = false"><i class="far fa-times"></i></a>
        </div>
        <div>
          <div class="flex space-x-3 items-center">
            <app-custom-input
              appGetClickEvent
              (clickedElement)="onClickManufacturer($event)"
              [options]="manufacturerList"
              inputPlaceholder="Select Manufacturer"
              [itemsOpened]="manufactureOpened"
              (selectedId)="onSelectManuFacturer($event)"
              [inputSearch]="manufacturerPlaceholder"
            ></app-custom-input>
            <div class="relative">
              <input placeholder="Tracker Id"
                     class="w-full px-4 py-4 rounded-lg outline-none ring-none  border-none bg-input">
            </div>
          </div>
        </div>
        <button (click)="onClickAddTruckerSave()" type="button" class="float-end text-white bg-primary px-4 py-2 w-32 align-self-end self-end rounded-lg">
          Save
        </button>
      </div>
      </tbody>
    </table>
  </div>
</div>
<app-create-popup (isModalClosed)="isOpen = !$event" [isOpen]="isOpen">
  <app-file-upload-popup></app-file-upload-popup>
</app-create-popup>
