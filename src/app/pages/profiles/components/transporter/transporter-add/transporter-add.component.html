<div class="flex w-full h-full">
  <div class="p-8 hidden lg:flex items-center justify-center bg-input rounded-l-lg">
    <div>
      <img src="assets/images/customer-create.png" alt="">
    </div>
  </div>
  <div class="p-8 max-h-[90vh] overflow-y-auto overflow-x-hidden">
    <h3 class="text-not-black font-semibold text-xl mb-4">Add New Transporter</h3>
    <form [formGroup]="transporterForm" (ngSubmit)="onSave()"
          class="w-full  flex flex-col space-y-3 lg:space-y-0 lg:grid grid-cols-1 lg:grid-cols-2 gap-3 text-[0.875rem] text-web-text-secondary">
      <div class="flex flex-col w-full lg:col-span-2">
        <label for="name">Transporter name</label>
        <input placeholder="Enter Transporter Name" class="bg-input rounded-lg  border-none p-4" type="text" id="name"
               formControlName="name">
        <div *ngIf="transporterForm.get('name').dirty" class="text-red text-xs">
          <span>{{getNameErrorMessage()}}</span>
        </div>
        <!--        error-message-->
      </div>
      <div class="flex flex-col w-full">
        <label for="phone">Mobile</label>
        <input placeholder="Enter Mobile" class="bg-input rounded-lg  border-none p-4" type="text" id="phone"
               formControlName="phone">
        <div *ngIf="transporterForm.get('phone').dirty" class="text-red text-xs">
          <span>{{getErrorMessage()}}</span>
        </div>
        <!--        error-message-->
      </div>
      <div class="flex flex-col w-full">
        <label for="truckStand">Truck Stand</label>
        <input placeholder="Enter Truck Stand" class="bg-input rounded-lg  border-none p-4" type="text" id="truckStand"
               formControlName="truckStand">
        <!--        error-message-->
      </div>
      <div class="flex flex-col lg:col-span-2 w-full">
        <label for="preferredPaymentMethod">Preferred Payment Method</label>
        <app-custom-input id="preferredPaymentMethod" [inputSearch]="paymentInputPlaceholder"
                          [customOpened]="false"
                          [options]="paymentOptionsArray"
                          [itemsOpened]="paymentOpened"
                          inputPlaceholder="Select Payment Method"
                          appGetClickEvent (clickedElement)="onClickPayment($event)"
                          (selectedId)="onSelectPayment($event)"></app-custom-input>
      </div>
      <ng-container *ngIf="paymentInputPlaceholder == 'Bkash'">
        <div class="flex flex-col">
          <label for="note">Bkash Account Name</label>
          <input placeholder="Enter Bkash Account Name" class="bg-input rounded-lg  border-none p-4" type="text" id="note"
                 formControlName="bkashName">
        </div>
        <div class="flex flex-col">
          <label for="note">Bkash Number</label>
          <input placeholder="Enter Bkash number" class="bg-input rounded-lg  border-none p-4" type="text" id="note"
                 formControlName="bkashNumber">
        </div>
        <div class="flex flex-col lg:col-span-2" >
          <label for="accountType">Account Type</label>
          <app-custom-input id="accountType" [inputSearch]="bkashPaymentTypePlaceholder"
                            [customOpened]="false"
                            [options]="bkashPaymentMethod"
                            [itemsOpened]="bkashOpened"
                            inputPlaceholder="Select Account Type"
                            appGetClickEvent (clickedElement)="onClickBkashType($event)"
                            (selectedId)="onSelectBkashType($event)"></app-custom-input>
        </div>
      </ng-container>
      <ng-container *ngIf="paymentInputPlaceholder == 'Bank'">
        <div class="flex flex-col">
          <label for="note">Bank Name</label>
          <input placeholder="Enter bank name" class="bg-input rounded-lg  border-none p-4" type="text" id="note"
                 formControlName="bankName">
        </div>
        <div class="flex flex-col">
          <label for="note">Bank Branch</label>
          <input placeholder="Enter bank branch" class="bg-input rounded-lg  border-none p-4" type="text" id="note"
                 formControlName="bankBranch">
        </div>
        <div class="flex flex-col">
          <label for="note">Bank Account Name</label>
          <input placeholder="Enter bank account name" class="bg-input rounded-lg  border-none p-4" type="text" id="note"
                 formControlName="bankAccountName">
        </div>
        <div class="flex flex-col">
          <label for="note">Bank Account No.</label>
          <input placeholder="Enter bank account no." class="bg-input rounded-lg  border-none p-4" type="text" id="note"
                 formControlName="bankAccountNumber">
        </div>
      </ng-container>
      <div class="flex flex-col w-full lg:col-span-2">
        <label for="note">Note (Optional)</label>
        <input placeholder="Enter Note." class="bg-input rounded-lg  border-none p-4" type="text" id="note"
               formControlName="note">
      </div>
      <div class="lg:col-span-2 pb-4">
        <button class="float-end py-2 px-12 flex justify-center items-center rounded-lg bg-primary text-white">
          <span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
