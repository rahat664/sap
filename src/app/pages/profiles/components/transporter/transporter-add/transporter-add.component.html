<div class="">
  <div class="flex justify-between items-center py-3.5 px-6 bg-white rounded-lg m-3">
    <h1 class="text-h3 leading-h3 text-not-black font-semibold">Transporter Add</h1>
    <button (click)="onSave()" class="py-2.5 px-12 text-white bg-primary rounded-lg">Save</button>
  </div>
  <div class="grid md:grid-cols-2 mx-3 mb-3">
    <div class="bg-white rounded-lg p-4 flex flex-col space-y-3">
      <div class="flex items-center space-x-3">
        <img src="assets/svg/transporter-info.svg">
        <h1 class="text-h2 leading-h2 text-not-black font-semibold">Transporter info</h1>
      </div>
      <form
        [formGroup]="transporterForm"
        class="w-full flex flex-col space-y-3 lg:space-y-0 lg:grid grid-cols-1 lg:grid-cols-2 gap-3 text-body_title text-web-text-secondary">
        <div class="flex flex-col space-y-2 w-full lg:col-span-2">
          <label for="name">Transporter name</label>
          <mat-form-field appearance="outline" class="example-full-width "
                          [ngClass]="{'error': transporterForm.get('name').invalid && transporterForm.get('name').touched}"
          >
            <input
              id="name"
              [minLength]="2"
              [maxLength]="50"
              type="text"
              matInput
              formControlName="name"
              placeholder="Enter Transporter Name">
          </mat-form-field>
          <div
            *ngIf="transporterForm.get('name').touched"
            class="text-red text-xs">
            <span>{{ getNameErrorMessage() }}</span>
          </div>
          <!--        error-message-->
        </div>
        <div class="flex flex-col space-y-2 w-full">
          <ngx-material-intl-tel-input [includeDialCode]="false" #numberInput class="customize" id="phoneNumber"
                                       [textLabels]="textLabels"
                                       [autoSelectedCountry]="CountryISO.Bangladesh"
                                       [preferredCountries]="[CountryISO.Bangladesh]"
                                       [fieldControl]="phoneNumber"
                                       [numberValidation]="true" [hidePhoneIcon]="true"
                                       [required]="true" [autoIpLookup]="false"
                                       [ngClass]="{ 'customError' : transporterForm.get('phone').invalid && transporterForm.get('phone').touched }"
          ></ngx-material-intl-tel-input>
          <!--        error-message-->
          <div>
          <span *ngIf="transporterForm.get('phone').touched && transporterForm.get('phone').invalid"
                class="text-red text-xs">
            <span>Phone number is required</span>
          </span>
          </div>
        </div>
        <div class="flex flex-col space-y-2 w-full">
          <label for="truckStand">Truck Stand</label>
          <mat-form-field appearance="outline" class="example-full-width "
                          [ngClass]="{'error': transporterForm.get('truckStand').invalid && transporterForm.get('truckStand').touched}"
          >
            <input
              id="truckStand"
              type="text"
              matInput
              formControlName="truckStand"
              placeholder="Enter Truck Stand">
          </mat-form-field>
          <div
            *ngIf="transporterForm.get('truckStand').touched && transporterForm.get('truckStand').invalid"
            class="text-red text-xs">
            <span>Truck stand is required</span>
          </div>
          <!--        error-message-->
        </div>
        <div class="flex flex-col space-y-2 lg:col-span-2 w-full">
          <label for="preferredPaymentMethod">Preferred Payment Method</label>
          <app-custom-input
            id="preferredPaymentMethod"
            [inputSearch]="paymentInputPlaceholder"
            [options]="paymentOptionsArray"
            inputPlaceholder="Select Payment Method"
            appGetClickEvent
            (clickedElement)="onClickPayment($event)"
            (selectedId)="onSelectPayment($event)"></app-custom-input>
          <div
            *ngIf="transporterForm.get('preferredPaymentMethod').touched && transporterForm.get('preferredPaymentMethod').invalid"
            class="text-red text-xs">
            <span>Preferred payment method is required</span>
          </div>
        </div>
        <ng-container *ngIf="paymentInputPlaceholder === 'Bkash'">
          <div class="flex flex-col space-y-2">
            <label for="bkashName">Bkash Account Name</label>
            <mat-form-field appearance="outline" class="example-full-width ">
              <input
                id="bkashName"
                [minLength]="2"
                [maxLength]="50"
                type="text"
                matInput
                formControlName="bkashName"
                placeholder="Enter Bkash Account Name">
            </mat-form-field>
          </div>
          <div class="flex flex-col space-y-2">
            <label for="bkashNumber">Bkash Number</label>
            <mat-form-field appearance="outline" class="example-full-width ">
              <input
                id="bkashNumber"
                [minLength]="11"
                [maxLength]="11"
                type="text"
                matInput
                formControlName="bkashNumber"
                placeholder="Enter Bkash Number">
            </mat-form-field>
          </div>
          <div class="flex flex-col space-y-2 lg:col-span-2">
            <label for="accountType">Account Type</label>
            <app-custom-input
              id="accountType"
              [inputSearch]="bkashPaymentTypePlaceholder"
              [options]="bkashPaymentMethod"
              inputPlaceholder="Select Account Type"
              appGetClickEvent
              (clickedElement)="onClickBkashType($event)"
              (selectedId)="onSelectBkashType($event)"></app-custom-input>
          </div>
        </ng-container>
        <ng-container *ngIf="paymentInputPlaceholder === 'Bank'">
          <div class="flex flex-col space-y-2">
            <label for="bankName">Bank Name</label>
            <mat-form-field appearance="outline" class="example-full-width ">
              <input
                id="bankName"
                type="text"
                matInput
                formControlName="bankName"
                placeholder="Enter Bank Name">
            </mat-form-field>
          </div>
          <div class="flex flex-col space-y-2">
            <label for="bankBranch">Bank Branch</label>
            <mat-form-field appearance="outline" class="example-full-width ">
              <input
                id="bankBranch"
                type="text"
                matInput
                formControlName="bankBranch"
                placeholder="Enter Bank Branch">
            </mat-form-field>
          </div>
          <div class="flex flex-col space-y-2">
            <label for="bankAccountName">Bank Account Name</label>
            <mat-form-field appearance="outline" class="example-full-width ">
              <input
                id="bankAccountName"
                type="text"
                matInput
                formControlName="bankAccountName"
                placeholder="Enter Bank Account Name">
            </mat-form-field>
          </div>
          <div class="flex flex-col space-y-2">
            <label for="bankAccountNumber">Bank Account Number</label>
            <mat-form-field appearance="outline" class="example-full-width ">
              <input
                id="bankAccountNumber"
                type="text"
                matInput
                formControlName="bankAccountNumber"
                placeholder="Enter Bank Account Number">
            </mat-form-field>
          </div>
        </ng-container>
        <div class="flex flex-col space-y-2 w-full lg:col-span-2">
          <label for="note">Note (Optional)</label>
          <mat-form-field appearance="outline" class="example-full-width ">
            <input
              id="note"
              matInput
              formControlName="note"
              placeholder="Enter Note"
            >
          </mat-form-field>
        </div>
      </form>
    </div>
  </div>
  <div class="grid md:grid-cols-2 mx-3 mb-3">
    <div class="flex flex-col space-y-3 bg-white p-4 rounded-lg">
      <div class="flex justify-between items-center">
        <div class="flex space-x-3 items-center">
          <img class="notPreview" src="assets/svg/document.svg">
          <h1 class="text-h2 leading-h2 text-not-black font-semibold">Transporter's documents</h1>
        </div>
      </div>
      <div class="flex flex-col space-y-1">
        <ng-container *ngFor="let option of transporterFileType; index as i">
          <div class="flex justify-between items-center min-h-[4.25rem] bg-input rounded-lg pl-3 pr-6">
            <div class="flex space-x-4 items-center">
              <img src="assets/svg/not-available.svg" class="notPreview" alt="">
              <img src="assets/svg/available.svg" alt="" class="notPreview">
              <div class="flex flex-col space-y-0.5">
                    <span
                      class="text-not-black text-body_title leading-body_title font-semibold">{{ option.name }}</span>
              </div>
            </div>
            <div class="flex space-x-6 items-center">
              <div class="flex">
                <div class="flex space-x-3 relative">
                  <div class="w-[2.75rem] h-[3.75rem] object-center border border-blue relative"
                       *ngFor="let file of getSpecificFiles(option?.formControlName)">
                    <ng-container *ngIf="file.file.type === 'application/pdf'; else imagePreview">
                      <!-- Display PDF Preview -->
                      <img (click)="$event.stopPropagation();onClickPdfDocument(file)"
                           class="h-full w-full"
                           src="assets/svg/pdf.svg"
                           alt=""/>
                    </ng-container>
                    <ng-template #imagePreview>
                      <!-- Display Image Preview -->
                      <img class="h-full w-full" [src]="file" alt=""/>
                    </ng-template>
                    <button (click)="onCloseImage(option?.formControlName, file, option?.expiryFormControlName)"
                            class="absolute -top-1 -right-2 bg-red flex justify-center items-center w-5 h-5 rounded-full text-white ">
                      <i class="far fa-times"></i>
                    </button>
                  </div>
                </div>
                <div *ngIf="getFileArray(option?.formControlName).length > 3">
                </div>
              </div>
              <app-upload-button
                [buttonColor]="everyThingDisabled ? 'bg-input-hint' : ''"
                [textColor]="everyThingDisabled ? 'text-input-hint' : 'text-link'"
                [isDisabled]="everyThingDisabled"
                *ngIf="getSpecificFiles(option?.formControlName)?.length === 0 || !getSpecificFiles(option?.formControlName)"
                buttonText="Upload"
                [file]="true"
                (click)="triggerFileUpload(option?.formControlName, option.max)"
                [icon]="everyThingDisabled ? 'disable-upload': 'upload'"></app-upload-button>
              <app-upload-button
                [isDisabled]="everyThingDisabled"
                *ngIf="getSpecificFiles(option?.formControlName)?.length > 0 && getSpecificFiles(option?.formControlName)?.length < option?.max"
                (click)="triggerFileUpload(option?.formControlName, option.max)"
                icon="plus"></app-upload-button>
              <input [multiple]="option.multiple" type="file" #fileInput accept=".png, .jpg, .jpeg, .pdf"
                     style="display:none;" (change)="onFileSelected($event)"/>
            </div>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
</div>
