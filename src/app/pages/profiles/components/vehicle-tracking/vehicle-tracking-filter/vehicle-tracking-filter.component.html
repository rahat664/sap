<div
  class="fixed top-0 right-0 w-[26rem] bg-white  h-full flex flex-col z-50 shadow-lg justify-between px-8 pb-6 overflow-auto transform transition-transform translate-x-0">
  <div class="flex flex-col justify-between h-full">
    <div
      class="flex flex-col">
      <div class="flex items-center justify-between py-6 sticky top-0">
        <h2 class="text-h3 leading-h3 font-semibold">Filters</h2>
        <button (click)="onClose()" class="text-not-black hover:text-black">
          <i class="fal fa-times text-xl text-primary"></i>
        </button>
      </div>
      <div class="w-full flex flex-col space-y-3">
        <div class="flex flex-col space-y-2 w-full">
          <label class="text-body text-web-text-secondary "
          >Transporter Name
          </label>
          <mat-form-field
            (mouseenter)="updateOverLayStyle(false)" appearance="outline" class="example-full-width filter">
            <input
              type="text"
              matInput
              (keyup)="onKeyUpTransporterSearch($event)"
              [(ngModel)]="searchTransporter"
              placeholder="Enter Transporter Name"
              [matAutocomplete]="transporter" />
            <mat-autocomplete #transporter="matAutocomplete">
              @for (option of transporterSuggestions; track option) {
                <mat-option
                  (click)="onClickTransporterSearchSuggestion(option)"
                  [value]="option.name"
                >{{ option.name ? option.name : option }}
                </mat-option>
              }
            </mat-autocomplete>
            <button
              type="button"
              (click)="onClickClearTransporter()"
              *ngIf="transporterName"
              class="absolute inset-y-0 bottom-2 pl-2 mb-0.5 -right-3 flex items-center">
              <i class="far fa-times text-gray-500 text-xs"></i>
            </button>
          </mat-form-field>
        </div>
      </div>
    </div>
    <div class="w-full " >
      <button class="bg-primary text-white rounded-lg py-2 font-semibold w-full" (click)="onApplyFilter()">Apply Filter
      </button>
    </div>
  </div>
</div>
