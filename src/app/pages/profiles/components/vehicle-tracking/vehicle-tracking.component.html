<div class="p-4 flex flex-col space-y-3">
  <div
    appGetElementHeight
    (height)="height = $event"
    class="flex flex-col space-y-3">
    <div
      class="flex flex-col space-y-3 lg:space-y-0 lg:flex-row justify-between">
      <h1 class="text-h1 leading-h1 font-semibold">Vehicle</h1>
    </div>

    <div class="w-full bg-white rounded-lg">
      <button
        class="flex px-2 py-1 space-x-3 items-center w-full"
        [ngClass]="{ 'border-b-2 border-[#0CD5F0]': filterOpened }">
        <i (click)="onClickFilterOpened()" *ngIf="!filterOpened"
           class="fas fa-caret-down text-input-hint text-xl"></i>
        <i (click)="onClickFilterOpened()" *ngIf="filterOpened"
           class="fas fa-caret-up text-input-hint text-xl"></i>
        <span class="text-not-black text-body_title leading-body_title"
        >Filter
          <span *ngIf="getFilterLength() > 0"
                class="text-input-hint"
          >({{ getFilterLength() }})</span
          >
          <span *ngIf="getFilterLength() > 0" class="text-input-hint px-3"
          >|</span
          >
          <a
            *ngIf="getFilterLength() > 0"
            (click)="onClearFilter()"
            class="text-red"
          >Clear all</a
          >
        </span>
      </button>
      <div *ngIf="filterOpened" class="p-4 flex items-center space-x-3">

        <div class="flex flex-col space-y-1 w-1/3">
          <label class="text-body  text-web-text-secondary px-2">Transporter
            Name
          </label>
          <mat-form-field appearance="outline" class="example-full-width ">
            <input
              type="text"
              matInput
              (keyup)="onKeyUpTransporterSearch($event)"
              [(ngModel)]="transporterName"
              placeholder="Enter Transporter Name"
              [matAutocomplete]="transporter">
            <mat-autocomplete #transporter="matAutocomplete">
              @for (option of transporterSuggestions; track option) {
                <mat-option (click)="onClickTransporterSearchSuggestion(option)"
                            [value]="option.name">{{ option.name ? option.name : option}}
                </mat-option>
              }
            </mat-autocomplete>
          </mat-form-field>
        </div>
        <div class="flex flex-col space-y-1 w-1/3">
          <label class="text-body  text-web-text-secondary px-2">Truck
          </label>
          <mat-form-field appearance="outline" class="example-full-width">
            <input
              type="text"
              matInput
              (keyup)="onKeyUpTruckSearch($event)"
              [(ngModel)]="truckRegistrationId"
              placeholder="Enter Truck ID"
              [matAutocomplete]="truck">
            <mat-autocomplete #truck="matAutocomplete">
              @for (option of truckRegSuggestions; track option) {
                <mat-option (click)="onClickTruckSearchSuggestion(option)"
                            [value]="option.fullRegistrationNumber">{{
                    option.fullRegistrationNumber ? option.fullRegistrationNumber : option}}
                </mat-option>
              }
            </mat-autocomplete>
          </mat-form-field>
        </div>
      </div>
    </div>
  </div>
  <div
    class="h-[calc(100vh-18.5rem)] bg-transparent rounded-lg overflow-hidden border border-line relative">
    <app-trucking-map [truckLocationPosition]="truckLocationPosition"></app-trucking-map>
    <div class="absolute top-4 left-4 flex space-x-3">
      <ng-container *ngFor="let conditions of conditionList">
        <button
          (click)="onClickCondition(conditions)"
          class="px-4 {{conditions.value == condition ? 'border border-link scale-110':
          'border-line border'}} py-1 rounded-full {{conditions?.color}} {{conditions?.backgroundColor}}">{{
            conditions?.viewValue }}
          <span>({{ conditions?.count }})</span></button>
      </ng-container>
    </div>
  </div>
</div>
