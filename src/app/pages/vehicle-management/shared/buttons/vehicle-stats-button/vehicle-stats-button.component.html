<button (click)="onClick()" class="w-[11.875rem]  h-[4.438rem] {{active ? 'bg-not-primary' : 'bg-white border border-not-primary'}}   rounded-lg flex items-center justify-center text-center">
  <div>
    <h3 class="font-bold text-h1_mobile leading-h1_mobile {{active ? 'text-white' : 'text-not-black'}}">{{ totalNumber }}</h3>
    <span class="{{active ? 'text-white' : 'text-secondary'}} text-body">{{ title }}</span>
  </div>
</button>
