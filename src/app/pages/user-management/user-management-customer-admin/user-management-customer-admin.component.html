<div class="p-4 flex flex-col space-y-3">
  <div
    appGetElementHeight
    (height)="height = $event"
    class="flex flex-col space-y-3">
    <div
      class="flex flex-col space-y-3 lg:space-y-0 lg:flex-row justify-between">
      <h1 class="text-h1_mobile leading-h1_mobile lg:text-h1 lg:leading-h1 font-semibold">Admin</h1>
      <div class="flex space-x-2 justify-between items-center">
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <img src="assets/svg/search.svg" class="notPreview" alt="search"/>
          </div>
          <button
            (click)="onClickClear()"
            *ngIf="searchValue"
            class="absolute inset-y-0 right-0 pr-3 flex items-center">
            <i class="far fa-times text-gray-500 text-xs"></i>
          </button>
          <input
            (keyup)="onKeyUpSearch($event)"
            type="text"
            name="email"
            class="border-none text-input-hint w-full lg:w-[24rem] bg-white sm:text-sm rounded-lg focus:ring-cyan-600 focus:border-cyan-600 block pl-10 p-2.5"
            placeholder="Search  name, mobile, email" />
        </div>
        <button
          (click)="onClickAddUser()"
          class="px-4 flex space-x-4 items-center py-3 lg:py-2 bg-primary text-white rounded-lg">
          <i class="fas fa-plus-circle"></i>
          <span class="hidden lg:block">Add New User</span>
        </button>
        <button (click)="onClickFilterOpen()" class="cursor-pointer flex space-x-1  text-h2_medium text-primary">
          <img class="notPreview" src="assets/svg/filter.svg" alt="">
          <p>Filter</p>
        </button>
      </div>
    </div>
    <!--  filter section-->
    <div *ngIf="filterApplied" class="w-full justify-between flex border border-blue items-center px-2 py-2 bg-input rounded-lg">
      <span class="text-xs text-not-black">Showing results for <span [innerHTML]="filterSummary"></span></span>
      <a class="text-red test xs cursor-pointer" (click)="onCLickClearAll()">Clear all</a>
    </div>
  </div>
  <div
    appGiveMaxHeight
    [totalPage]="totalPages"
    (inBottomEnd)="onBottom($event)"
    [anotherItemsHeight]="height"
    class="bg-white w-full relative rounded-lg overflow-auto">
    <table class="table-auto w-full text-body_title leading-body_title">
      <thead>
      <tr class="whitespace-nowrap bg-white">
        <th class="text-left">Name</th>
        <th class="text-left">Mobile</th>
        <th class="text-left">Email</th>
        <th class="text-left">Type</th>
        <th class="text-left">Designation</th>
        <th class="text-left">Status</th>
        <th class="text-left whitespace-nowrap">Created On</th>
        <th style="width: 5% !important"></th>
      </tr>
      <tr>
        <th class="custom-border" colspan="8"></th>
      </tr>
      </thead>
      <tbody class="text-web-text-secondary">
      <ng-container *ngIf="!loading">
        <tr *ngFor="let user of Users">
          <td class="whitespace-nowrap">{{ user.name }}</td>
          <td>
            <a
              class="cursor-pointer"
              (click)="copyNumber($event, user.phone)"
            >{{ user.phone }}</a
            >
          </td>
          <td>
            <a href="mailto:{{ user.email }}">{{ user.email }}</a>
          </td>
          <td>{{ getUserType(user.roles) }}</td>
          <td>{{ user.designation }}</td>
          <td>{{ user.status }}</td>
          <td class="whitespace-nowrap">
            {{ user.createdOn ? (user.createdOn | date: 'd MMM yyyy') : '' }}
          </td>
          <td>
            <button
              *ngIf="user.status != 'Removed'"
              mat-button
              [matMenuTriggerFor]="menu">
              <i class="fas fa-ellipsis-v"></i>
            </button>
            <mat-menu #menu="matMenu">
              <button
                (click)="changeStatus(user.id, user.name, 'Inactive')"
                mat-menu-item
                *ngIf="user.status === 'Active'">
                <div class="flex space-x-2 items-center">
                  <img
                    class="notPreview"
                    src="./assets/svg/user-inactive.svg"
                    alt=""/>
                  <span>Inactive</span>
                </div>
              </button>
              <button
                (click)="changeStatus(user.id, user.name, 'Active')"
                mat-menu-item
                *ngIf="user.status === 'Inactive'">
                <div class="flex space-x-2 items-center">
                  <img
                    class="notPreview"
                    src="./assets/svg/user-active.svg"
                    alt=""/>
                  <span>Active</span>
                </div>
              </button>
              <button
                (click)="changeStatus(user.id, user.name, 'Removed')"
                mat-menu-item>
                <div class="flex space-x-2 items-center">
                  <img
                    class="notPreview"
                    src="./assets/svg/user-remove.svg"
                    alt=""/>
                  <span class="text-red">Remove</span>
                </div>
              </button>
            </mat-menu>
          </td>
        </tr>
      </ng-container>
      <ng-container *ngIf="!loading">
        <tr *ngIf="Users?.length === 0">
          <td class="h-full" colspan="9">
            <div class="flex items-center justify-center">
              <div
                class="w-full flex flex-col space-y-3 justify-center items-center">
                <img
                  loading="lazy"
                  src="assets/svg/no-data.svg"
                  class="notPreview"
                  alt="nodata"/>
                <p
                  class="text-body_title leading-body_title text-secondary font-semibold">
                  No Data Found
                </p>
              </div>
            </div>
          </td>
        </tr>
      </ng-container>
      <ng-container *ngIf="loading">
        <tr>
          <td class="h-full" colspan="9">
            <app-loading></app-loading>
          </td>
        </tr>
      </ng-container>
      </tbody>
    </table>
  </div>
</div>
<app-user-filter (filterData)="onFilterData($event)" (filterApplied)="onFilterApply()" (filterClosed)="filterOpened = false" *ngIf="filterOpened"></app-user-filter>
