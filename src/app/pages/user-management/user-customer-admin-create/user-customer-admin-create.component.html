<div class="flex w-full h-full">
  <button (click)="closeModal()"
          class="absolute top-0 right-0 p-4">
    <i class="fal fa-times text-primary"></i>
  </button>
  <div
    class="p-8 hidden lg:flex items-center justify-center bg-input rounded-l-lg">
    <div>
      <img loading="lazy" class="notPreview" src="assets/images/customer-create.png" alt="" />
    </div>
  </div>
  <div class="p-8 max-h-[90vh] overflow-y-auto overflow-x-hidden">
    <h3 class="text-not-black font-semibold text-xl mb-4">Add New User</h3>
    <form
      [formGroup]="userForm"
      (ngSubmit)="onSave()"
      class="w-full flex flex-col space-y-3 lg:space-y-0 lg:grid grid-cols-1 lg:grid-cols-2 gap-3 text-body_title leading-body_title text-web-text-secondary">
      <div class="flex flex-col w-full lg:col-span-2">
        <label for="name">Full Name</label>
        <input appAlphabetOnly
               required
               [minlength]="2"
               [maxlength]="50"
               placeholder="Enter Full Name"
               class="bg-input rounded-lg border-none p-4"
               type="text"
               id="name"
               formControlName="name" />
        <div *ngIf="userForm.get('name').touched" class="text-red text-xs">
          <span>{{ getNameErrorMessage() }}</span>
        </div>
        <!--        error-message-->
      </div>
      <div class="flex flex-col w-full">
        <label for="phone">Mobile</label>
        <input
          [minlength]="11"
          [maxlength]="11"
          placeholder="Enter Mobile"
          class="bg-input rounded-lg border-none p-4"
          type="text"
          id="phone"
          formControlName="phone" />
        <!--        error-message-->
        <div
          *ngIf="userForm.get('phone').dirty && !userForm.get('phone').touched"
          class="text-red text-xs">
          <span>{{ getPhoneErrorMessage() }}</span>
        </div>
        <div *ngIf="userForm.get('phone').touched" class="text-red text-xs">
          <span>{{ getPhoneErrorMessageWithTouch() }}</span>
        </div>
      </div>
      <div class="flex flex-col w-full">
        <label for="email">Email</label>
        <input
          placeholder="Enter Email"
          class="bg-input rounded-lg border-none p-4"
          type="text"
          id="email"
          formControlName="email" />
        <!--        error-message-->
        <div *ngIf="userForm.get('email').touched" class="text-red text-xs">
          <span>{{ getEmailErrorMessage() }}</span>
        </div>
      </div>
      <div class="flex flex-col w-full">
        <label for="designation">Designation</label>
        <input
          appAlphabetOnly
          placeholder="Enter Designation"
          class="bg-input rounded-lg border-none p-4"
          type="text"
          id="designation"
          formControlName="designation" />
        <!--        error-message-->
      </div>
      <div class="flex flex-col w-full">
        <label for="email">Type</label>
        <app-custom-input
          [inputSearch]="roleInputPlaceholder"
          [options]="roles"
          inputPlaceholder="Select Type"
          appGetClickEvent
          (clickedElement)="onClickRole($event)"
          (selectedId)="onSelectRole($event)"></app-custom-input>
      </div>
      <div class="lg:col-span-2 pb-4">
        <button
          class="float-end py-2 px-12 flex justify-center items-center rounded-lg bg-primary text-white">
          <span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
