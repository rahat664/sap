<div class="flex w-full h-full">
  <button (click)="closeModal()" class="absolute top-0 right-0 p-4">
    <i class="fal fa-times text-primary"></i>
  </button>
  <div
    class="p-8 hidden md:flex items-center justify-center bg-input rounded-l-lg">
    <div>
      <img
        loading="lazy"
        class="notPreview"
        src="assets/images/customer-create.png"
        alt=""/>
    </div>
  </div>
  <div class="p-8 max-h-[90vh] overflow-y-auto overflow-x-hidden">
    <h3 class="text-not-black font-semibold text-xl mb-4">Add New User</h3>
    <form
      [formGroup]="userForm"
      (ngSubmit)="onSave()"
      class="w-full flex flex-col space-y-3 md:space-y-0 md:grid grid-cols-1 md:grid-cols-2 gap-3 text-body_title leading-body_title text-web-text-secondary">
      <div class="flex flex-col space-y-2 w-full md:col-span-2">
        <label for="name">Full Name</label>
        <mat-form-field
          appearance="outline"
          class="example-full-width"
          [ngClass]="{
            error: userForm.get('name').invalid && userForm.get('name').touched,
          }">
          <input
            appAlphabetOnly
            id="name"
            [minLength]="2"
            [maxLength]="50"
            type="text"
            matInput
            formControlName="name"
            placeholder="Enter Name"/>
        </mat-form-field>
        <div *ngIf="userForm.get('name').touched" class="text-red text-xs">
          <span>{{ getNameErrorMessage() }}</span>
        </div>
        <!--        error-message-->
      </div>
      <div class="flex flex-col space-y-2 w-full">
        <ngx-material-intl-tel-input
          [includeDialCode]="false"
          #numberInput
          class="customize"
          id="phoneNumber"
          [textLabels]="textLabels"
          [autoSelectedCountry]="CountryISO.Bangladesh"
          [preferredCountries]="[CountryISO.Bangladesh]"
          [fieldControl]="phoneNumber"
          [numberValidation]="true"
          [useMask]="true"
          [hidePhoneIcon]="true"
          [required]="true"
          [autoIpLookup]="false"
          (focusout)="phoneNumber?.markAsTouched()"
          [ngClass]="{
            customError:
              userForm.get('phone').invalid && userForm.get('phone').touched,
          }"></ngx-material-intl-tel-input>
        <!--        error-message-->
        <div>
          <span
            *ngIf="
              userForm.get('phone').touched && userForm.get('phone').invalid
            "
            class="text-red text-xs">
            <span>{{ getPhoneErrorMessageWithTouch() }}</span>
          </span>
        </div>
      </div>
      <div class="flex flex-col space-y-2 w-full">
        <label for="email">Email</label>
        <mat-form-field
          appearance="outline"
          class="example-full-width"
          [ngClass]="{
            error:
              userForm.get('email').invalid && userForm.get('email').touched,
          }">
          <input
            id="email"
            type="text"
            matInput
            formControlName="email"
            placeholder="Enter Email"/>
        </mat-form-field>
        <!--        error-message-->
        <div *ngIf="userForm.get('email').touched" class="text-red text-xs">
          <span>{{ getEmailErrorMessage() }}</span>
        </div>
      </div>
      <div class="flex flex-col space-y-1 w-full">
        <label for="designation">Designation</label>
        <mat-form-field
          appearance="outline"
          class="example-full-width"
          [ngClass]="{
            error:
              userForm.get('designation').invalid && userForm.get('designation').touched,
          }">
          <input
            id="designation"
            type="text"
            matInput
            formControlName="designation"
            placeholder="Enter Designation"/>
        </mat-form-field>
        <!--        error-message-->
      </div>
      <div class="flex flex-col space-y-1 w-full">
        <label for="email">Type</label>
        <app-custom-input
          [isFilterMenu]="false"
          [inputSearch]="roleInputPlaceholder"
          [options]="roles"
          inputPlaceholder="Select Type"
          appGetClickEvent
          (clickedElement)="onClickRole($event)"
          (selectedId)="onSelectRole($event)"></app-custom-input>
      </div>
      <div class="flex flex-col w-full">
        <mat-checkbox (change)="SendEmail($any($event))">
          Send email to user
        </mat-checkbox>
      </div>

      <div class="md:col-span-2 pb-4">
        <button
          class="float-end py-2 px-12 flex justify-center items-center rounded-lg bg-primary text-white">
          <span>Save</span>
        </button>
      </div>
    </form>
  </div>
</div>
