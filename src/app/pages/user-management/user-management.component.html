<div class="p-4 flex flex-col space-y-3">
  <div
    appGetElementHeight
    (height)="height = $event"
    class="flex flex-col space-y-3">
    <div
      class="flex flex-col space-y-3 lg:space-y-0 lg:flex-row justify-between">
      <h1 class="text-h1 leading-h1 font-semibold">Admin</h1>
      <div class="flex space-x-4 items-center">
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
              <img src="assets/svg/search.svg" class="notPreview" alt="search"/>
          </div>
            <button
                    (click)="onClickClear()"
                    *ngIf="searchValue"
                    class="absolute inset-y-0 right-0 pr-3 flex items-center">
            <i class="far fa-times text-gray-500 text-xs"></i>
          </button>
          <input
            (keyup)="onKeyUpSearch($event)"
            type="text"
            name="email"
            class="border-none text-input-hint w-[24rem] bg-white sm:text-sm rounded-lg focus:ring-cyan-600 focus:border-cyan-600 block pl-10 p-2.5"
            placeholder="Search  name, mobile, email" />
        </div>
        <button
          (click)="onClickAddUser()"
          class=" flex space-x-4 items-center px-4 py-2 bg-primary text-white rounded-lg">
          <i class="fas fa-plus-circle"></i>
          <span class="hidden lg:block">Add New User</span>
        </button>
      </div>
    </div>
    <!--  filter section-->
    <div class="w-full bg-white rounded-lg">
      <button
        class="flex px-2 py-1 space-x-3 items-center w-full"
        [ngClass]="{ 'border-b border-[#A1D5DE]': filterOpened }">
          <i
                  (click)="onClickFilterOpened()"
                  *ngIf="!filterOpened"
                  class="fas fa-caret-down text-input-hint text-xl"></i>
          <i
                  (click)="onClickFilterOpened()"
                  *ngIf="filterOpened"
                  class="fas fa-caret-up text-input-hint text-xl"></i>
        <span class="text-not-black text-body_title leading-body_title"
        >Filter
          <span *ngIf="getFilterLength() > 0"
          >({{ statusFilter + roleFilter }})</span
          >
          <span *ngIf="getFilterLength() > 0" class="text-input-hint px-3"
          >|</span
          >
          <a
            (click)="onClearFilter()"
            *ngIf="getFilterLength() > 0"
            class="text-red"
          >Clear all</a
          >
        </span>
      </button>
      <div *ngIf="filterOpened" class="p-4 flex items-center space-x-3">
        <app-custom-input
          appGetClickEvent
          [inputSearch]="statusInputPlaceholder"
          (clickedElement)="onClickStatus($event)"
          [options]="statusOptionsArray"
          inputPlaceholder="Select Status"
          (selectedId)="onSelectStatus($event)"></app-custom-input>
        <app-custom-input
          [inputSearch]="roleInputPlaceholder"
          [options]="roleOptionsArray"
          inputPlaceholder="Select Department"
          appGetClickEvent
          (clickedElement)="onClickRole($event)"
          (selectedId)="onSelectRole($event)"></app-custom-input>
      </div>
    </div>
  </div>
  <div
    appGiveMaxHeight
    [totalPage]="totalPages"
    (inBottomEnd)="onBottom($event)"
    [anotherItemsHeight]="height"
    class="bg-white w-full relative rounded-lg overflow-auto">
    <table class="table-auto w-full text-body_title leading-body_title">
      <thead>
      <tr class="whitespace-nowrap bg-white">
          <th class="text-left">Name</th>
          <th class="text-left">Mobile</th>
          <th class="text-left">Email</th>
          <th class="text-left">Department</th>
          <th class="text-left">Designation</th>
          <th class="text-left">Status</th>
          <th class="text-left whitespace-nowrap">Created On</th>
          <th style="width: 5% !important"></th>
      </tr>
      <tr>
          <th class="custom-border" colspan="8"></th>
      </tr>
      </thead>
      <tbody class="text-web-text-secondary">
      <ng-container *ngIf="!loading">
          <tr *ngFor="let user of Users">
              <td class="whitespace-nowrap">{{ user.name }}</td>
              <td>
                  <a
                          class="cursor-pointer"
                          (click)="copyNumber($event, user.mobile)"
                  >{{ user.mobile }}</a
                  >
              </td>
              <td>
                  <a href="mailto:{{ user.email }}">{{ user.email }}</a>
              </td>
              <td>{{ user.department }}</td>
              <td>{{ user.designation }}</td>
              <td>{{ user.status }}</td>
              <td class="whitespace-nowrap">
                  {{ user.createdOn ? (user.createdOn | date: 'd MMM yyyy') : '' }}
              </td>
              <td>
                  <button
                          *ngIf="user.status != 'Removed'"
                          mat-button
                          [matMenuTriggerFor]="menu">
                      <i class="fas fa-ellipsis-v"></i>
                  </button>
                  <mat-menu #menu="matMenu">
                      <button
                              (click)="changeStatus(user.id, user.name, 'Inactive')"
                              mat-menu-item
                              *ngIf="user.status === 'Active'">
                          <div class="flex space-x-2 items-center">
                              <img
                                      class="notPreview"
                                      src="./assets/svg/user-inactive.svg"
                                      alt=""/>
                              <span>Inactive</span>
                          </div>
                      </button>
                      <button
                              (click)="changeStatus(user.id, user.name, 'Active')"
                              mat-menu-item
                              *ngIf="user.status === 'Inactive'">
                          <div class="flex space-x-2 items-center">
                              <img
                                      class="notPreview"
                                      src="./assets/svg/user-active.svg"
                                      alt=""/>
                              <span>Active</span>
                          </div>
                      </button>
                      <button
                              (click)="changeStatus(user.id, user.name, 'Removed')"
                              mat-menu-item>
                          <div class="flex space-x-2 items-center">
                              <img
                                      class="notPreview"
                                      src="./assets/svg/user-remove.svg"
                                      alt=""/>
                              <span class="text-red">Remove</span>
                          </div>
                      </button>
                  </mat-menu>
              </td>
          </tr>
      </ng-container>
      <ng-container *ngIf="!loading">
          <tr *ngIf="Users?.length === 0">
              <td class="h-full" colspan="9">
                  <div class="flex items-center justify-center">
                      <div
                              class="w-full flex flex-col space-y-3 justify-center items-center">
                          <img
                                  loading="lazy"
                                  src="assets/svg/no-data.svg"
                                  class="notPreview"
                                  alt="nodata"/>
                          <p
                                  class="text-body_title leading-body_title text-secondary font-semibold">
                              No Data Found
                          </p>
                      </div>
                  </div>
              </td>
          </tr>
      </ng-container>
      <ng-container *ngIf="loading">
          <tr>
              <td class="h-full" colspan="9">
                  <app-loading></app-loading>
              </td>
          </tr>
      </ng-container>
      </tbody>
    </table>
  </div>
</div>
