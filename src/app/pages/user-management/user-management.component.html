<div class="p-4 flex flex-col space-y-3">
  <div
    appGetElementHeight
    (height)="height = $event"
    class="flex flex-col space-y-3">
    <div
      class="flex flex-col space-y-3 lg:space-y-0 lg:flex-row justify-between">
      <h1 class="text-h1 font-semibold">Admin</h1>
      <div class="flex space-x-4 items-center">
        <div class="relative">
          <div
            class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
            <i class="far fa-search text-gray-500"></i>
          </div>
          <input
            (keyup)="onKeyUpSearch($event)"
            type="text"
            name="email"
            id="topbar-search"
            class="border-none text-input-hint w-[24rem] bg-white sm:text-sm rounded-lg focus:ring-cyan-600 focus:border-cyan-600 block pl-10 p-2.5"
            placeholder="Search  name, mobile, email" />
        </div>
        <button
          (click)="onClickAddUser()"
          class="px-4 flex space-x-4 items-center py-3 lg:py-2 bg-primary text-white rounded-lg">
          <i class="fas fa-plus-circle"></i>
          <span class="hidden lg:block">Add New User</span>
        </button>
      </div>
    </div>
    <!--  filter section-->
    <div class="w-full bg-white rounded-lg">
      <button
        (click)="onClickFilterOpened()"
        class="flex px-2 py-1 space-x-3 items-center w-full"
        [ngClass]="{ 'border-b-2 border-[#0CD5F0]': filterOpened }">
        <i class="fas fa-caret-down text-input-hint text-xl"></i>
        <span class="text-not-black text-[0.875rem]"
        >Filter
          <span *ngIf="getFilterLength() > 0"
          >({{ statusFilter + roleFilter }})</span
          >
          <span *ngIf="getFilterLength() > 0" class="text-input-hint px-3"
          >|</span
          >
          <a
            (click)="onClearFilter()"
            *ngIf="getFilterLength() > 0"
            class="text-red"
          >Clear all</a
          >
        </span>
      </button>
      <div *ngIf="filterOpened" class="p-4 flex items-center space-x-3">
        <app-custom-input
          appGetClickEvent
          [inputSearch]="statusInputPlaceholder"
          (clickedElement)="onClickStatus($event)"
          [options]="statusOptionsArray"
          inputPlaceholder="Select Status"
          (selectedId)="onSelectStatus($event)"></app-custom-input>
        <app-custom-input
          [inputSearch]="roleInputPlaceholder"
          [options]="roleOptionsArray"
          inputPlaceholder="Select Department"
          appGetClickEvent
          (clickedElement)="onClickRole($event)"
          (selectedId)="onSelectRole($event)"></app-custom-input>
      </div>
    </div>
  </div>
  <div
    appGiveMaxHeight
    [totalPage]="totalPages"
    (inBottomEnd)="onBottom($event)"
    appCheckTheHeightCrossMaxHeightOrNot
    (maxHeightCrossed)="onMaxHeightCross($event)"
    [anotherItemsHeight]="height"
    class="bg-white w-full relative rounded-lg overflow-auto">
    <table class="table-auto w-full text-[0.875rem]">
      <thead>
      <tr class="whitespace-nowrap bg-white">
        <th class="text-left">Name</th>
        <th class="text-left">Mobile</th>
        <th class="text-left">Email</th>
        <th class="text-left">Department</th>
        <th class="text-left">Designation</th>
        <th class="text-left">Status</th>
        <th class="text-left">Created On</th>
        <th style="width: 5% !important"></th>
      </tr>
      <tr>
        <th class="border" colspan="8"></th>
      </tr>
      </thead>
      <tbody class="text-web-text-secondary">
      <ng-container *ngIf="!loading">
        <tr *ngFor="let user of Users">
          <td class="whitespace-nowrap">{{ user.name }}</td>
          <td>{{ user.mobile }}</td>
          <td>{{ user.email }}</td>
          <td>{{ user.department }}</td>
          <td>{{ user.designation }}</td>
          <td>{{ user.status }}</td>
          <td>{{ user.createdOn }}</td>
          <td>
            <div class="relative w-full">
              <button
                *ngIf="user.status != 'Removed'"
                (click)="actionOpen(user.id)"
                class="cursor-pointer w-full">
                <i class="fas fa-ellipsis-v"></i>
              </button>
              <div
                *ngIf="selectedId == user.id && actionOpened"
                class="absolute bg-white shadow-md rounded-lg z-50 py-2 w-32 right-0 top-full origin-top-right">
                <ul class="text-[0.875rem]">
                  <li
                    *ngIf="user.status === 'Active'"
                    class="py-2 px-4 hover:bg-input cursor-pointer">
                    <a
                      (click)="changeStatus(user.id, user.name, 'Inactive')"
                      class="w-full flex space-x-3 items-center">
                      <img
                        class="notPreview"
                        src="./assets/svg/user-inactive.svg"
                        alt="" />
                      <span>Inactive</span>
                    </a>
                  </li>
                  <li
                    *ngIf="user.status === 'Inactive'"
                    class="py-2 px-4 hover:bg-input">
                    <a
                      (click)="changeStatus(user.id, user.name, 'Active')"
                      class="w-full flex space-x-3 items-center cursor-pointer">
                      <img
                        class="notPreview"
                        src="./assets/svg/user-active.svg"
                        alt="" />
                      <span>Active</span>
                    </a>
                  </li>
                  <li class="py-2 px-4 hover:bg-input">
                    <a
                      (click)="changeStatus(user.id, user.name, 'Removed')"
                      class="w-full flex space-x-3 items-center cursor-pointer">
                      <img
                        class="notPreview"
                        src="./assets/svg/user-remove.svg"
                        alt="" />
                      <span class="text-red">Remove</span>
                    </a>
                  </li>
                </ul>
              </div>
            </div>
          </td>
        </tr>
      </ng-container>
      <ng-container *ngIf="!loading">
        <tr *ngIf="Users?.length === 0">
          <td class="h-full" colspan="9">
            <div class="flex items-center justify-center">
              <p class="text-center">No data found</p>
            </div>
          </td>
        </tr>
      </ng-container>
      <ng-container *ngIf="loading">
        <tr>
          <td class="h-full" colspan="9">
            <app-loading></app-loading>
          </td>
        </tr>
      </ng-container>
      </tbody>
    </table>
  </div>
</div>
<app-create-popup (isModalClosed)="isOpen = !$event" [isOpen]="isOpen">
  <app-user-create
    *ngIf="isOpen"
    (formCreated)="onCreateUser($event)"></app-user-create>
</app-create-popup>
<app-confirm-modal
  (isModalClosed)="confirmOpened = !$event"
  [isOpen]="confirmOpened"
  [buttonText]="buttonText"
  [userName]="userName"
  (performChangeStatus)="performChangeStatus()"></app-confirm-modal>
