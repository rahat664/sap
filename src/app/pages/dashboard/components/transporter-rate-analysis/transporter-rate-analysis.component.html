<div class="px-6 pb-5 custom-scroll bg-white rounded-lg flex flex-col space-y-3 relative">
  <div class="flex justify-between items-end z-0">
    <h2 class="text-h2 leading-h2 font-semibold text-not-black pt-5">
      Transporter Rate Analysis
      <a
        *ngIf="
          transporter || vehicleType || loadingDistrict || unloadingDistrict
        "
        (click)="clearAll()"
        class="font-semibold ml-2 text-red cursor-pointer text-body_title"
      >Clear all</a
      >
    </h2>

  </div>
  <div class="flex flex-col space-y-2 lg:space-y-0 lg:flex-row lg:space-x-3 items-center">
    <mat-form-field appearance="outline" class="w-full lg:w-[12rem] filter">
      <mat-select
        [(ngModel)]="chartType"
        placeholder="Chart"
        (selectionChange)="changeChartType($event)">
        <mat-option value="all">All</mat-option>
        <mat-option value="high">Highest rate</mat-option>
        <mat-option value="average">Average rate</mat-option>
        <mat-option value="low">Lowest rate</mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-full lg:w-[12rem] filter">
      <mat-select
        [(ngModel)]="vehicleType"
        (selectionChange)="onVehicleTypeChange($event)"
        placeholder="Vehicle Type">
        <mat-option
          *ngFor="let vehicle of vehicleTypeLists"
          [value]="vehicle?.id"
        >{{ vehicle?.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="lg:w-[12rem] w-full filter">
      <mat-select
        [(ngModel)]="transporter"
        (selectionChange)="onTransporterChange($event)"
        placeholder="Transporter">
        <mat-option
          *ngFor="let transporter of transporterLists"
          [value]="transporter?.code"
        >{{ transporter?.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-full lg:w-[12rem] filter">
      <mat-select
        [(ngModel)]="loadingDistrict"
        (selectionChange)="onLoadingDistrictChange($event)"
        placeholder="Loading District">
        <mat-option *ngFor="let district of districts" [value]="district?.name"
        >{{ district?.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-full lg:w-[13rem] filter">
      <mat-select
        [(ngModel)]="unloadingDistrict"
        (selectionChange)="onUnloadingDistrictChange($event)"
        placeholder="Unloading District">
        <mat-option *ngFor="let district of districts" [value]="district?.name"
        >{{ district?.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
    <mat-form-field appearance="outline" class="w-full lg:w-[13rem] filter">
      <mat-select
        [(ngModel)]="datatype"
        (selectionChange)="onDataTypeChange($event)"
        placeholder="Type">
        <mat-option value="daily">Daily</mat-option>
        <mat-option value="monthly">Monthly</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div>
    <app-line-chart
      [numberOfTrips]="numberOfTrips"
      class="cursor-pointer min-w-full"
      [seriesData]="seriesdata"
      [categories]="categories"
      [colors]="colors"
    ></app-line-chart>
  </div>
</div>
