<div class="px-6 py-5 bg-white rounded-lg flex flex-col space-y-[0.875rem]">
  <div class="flex justify-between items-center">
    <h2 class="text-h2 leading-h2 font-semibold text-not-black">
      Top Customer
    </h2>

    <!--        placeholder="Select date">-->

  </div>
  <div routerLink="/profile/customer" class="cursor-pointer flex flex-col space-y-4">
    <div class="grid grid-cols-4 gap-3 w-full py-1.5 text-body_title  border-b border-link
     text-not-black font-semibold">
      <span>Customer</span>
      <span class="text-center">No of trip</span>
      <span class="text-center">CR(৳)</span>
      <span class="text-center">GP(৳)</span>
    </div>
    <div class="flex flex-col space-y-5">
      <ng-container *ngFor="let customer of topCustomer">
        <div class="grid grid-cols-4 items-center w-full text-body text-not-black">
          <div class="flex space-x-3 items-center">
            <div class="text-body_title text-white flex justify-center items-center h-[1.75rem] w-[1.75rem] rounded-full {{getBackgroundColor(customer.customerName[0].toLocaleLowerCase())}} font-semibold">
              <span>{{customer.customerName[0].toLocaleUpperCase()}}</span>
            </div>
            <span class="flex-1">{{ customer.customerName }}</span>
          </div>
          <span class="text-center">{{ customer.noOfTrip }}</span>
          <span class="text-center">{{ customer.totalCustomerRate | number }} </span>
          <span class="text-center">{{ customer.totalGrossProfit | number }} </span>
        </div>
      </ng-container>
    </div>
  </div>
</div>
