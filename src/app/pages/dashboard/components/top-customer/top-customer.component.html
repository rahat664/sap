<div class="px-6 py-5 bg-white rounded-lg flex flex-col space-y-[0.875rem]">
  <div class="flex justify-between items-center">
    <h2 class="text-h2 leading-h2 font-semibold text-not-black">
      Top Customer
    </h2>
    <mat-form-field appearance="outline" class="w-[12rem] filter">
      <mat-select [(ngModel)]="sortBy" (selectionChange)="sortData()"
                  placeholder="Select sorting">
        <mat-option value="grossProfit">Gross Profit</mat-option>
        <mat-option value="totalTrip">No. of Trips</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div
    routerLink="/profile/customer"
    class="cursor-pointer flex flex-col space-y-4">
    <div
      class="grid grid-cols-4 gap-3 w-full py-1.5 text-body_title border-b border-blue text-not-black font-semibold">
      <span>Customer</span>
      <span class="text-center">No. of trips</span>
      <span class="text-center">CR(৳)</span>
      <span class="text-center">GP(৳)</span>
    </div>
    <ng-container *ngIf="!loading && !customerFilterEnabled">
      <div class="flex flex-col space-y-5">
        <ng-container *ngFor="let customer of topCustomer">
          <div
            class="grid grid-cols-4 items-center w-full text-body text-not-black">
            <div class="flex w-full space-x-3 items-center">
              <div
                class="text-body_title text-white flex justify-center items-center h-[1.75rem] w-[1.75rem] rounded-full {{
                getBackgroundColor(customer.customerName[0].toLocaleLowerCase())
              }} font-semibold ">
                <span>{{ customer.customerName[0].toLocaleUpperCase() }}</span>
              </div>
              <span class="flex-1">{{ customer.customerName }}</span>
            </div>
            <span class="text-center">{{ customer.noOfTrip }}</span>
            <span class="text-center"
            >{{ customer.totalCustomerRate | number }}
          </span>
            <span class="text-center"
            >{{ customer.totalGrossProfit | number }}
          </span>
          </div>
        </ng-container>
      </div>
    </ng-container>
    <ng-container *ngIf="loading">
      <div class="min-h-60 w-full flex items-center justify-center">
        <app-loading></app-loading>
      </div>
    </ng-container>
    <ng-container *ngIf="!loading && customerFilterEnabled">
      <div class="min-h-60 w-full flex items-center justify-center">
        <div
          class="w-full flex flex-col space-y-3 justify-center items-center">
          <img
            loading="lazy"
            src="assets/svg/no-data.svg"
            class="notPreview"
            alt="nodata"/>
          <p
            class="text-body_title leading-body_title text-secondary font-semibold">
            Top customer not allowed
          </p>
        </div>
      </div>
    </ng-container>
  </div>
</div>
