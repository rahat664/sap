<div class="px-6 py-5 bg-white rounded-lg flex flex-col space-y-[0.875rem]">
  <div class="flex justify-between items-center">
    <h2 class="text-h2 leading-h2 font-semibold text-not-black">
      Current Trip Status
    </h2>

    <!--        formControlName="vendorId"-->
    <!--        placeholder="Select date">-->

  </div>
  <div class="relative border border-line rounded-lg">
    <div class=" h-96 rounded-lg overflow-hidden">
      <app-g-map [starting]="startingPosition"
                 [destination]="destinationPosition" [tripStatus]="tripStatus"></app-g-map>
    </div>
    <div class="absolute w-full bg-white rounded-lg top-0 grid grid-cols-6 p-6 place-items-center">
      <ng-container *ngFor="let tripStatus of tripStatuses">
        <div class="flex flex-col w-full items-center space-y-1">
          <span class="text-body_title leading-body_title font-semibold">{{ tripStatus.count }}</span>
          <div class="flex space-x-2 items-center">
            <span class="w-[0.875rem] h-[0.875rem]  rounded-sm {{getColorByStatus(tripStatus.status)}}"></span>
            <span class="text-body text-web-text-secondary">{{ tripStatus.status }}</span>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</div>
