<div class="px-4 py-5 flex flex-col space-y-4 bg-white rounded-lg">
  <div class="flex space-x-[0.625rem] items-center">
    <div>
      <img
        src="assets/svg/{{ icon }}.svg"
        alt=""
        class="notPreview w-[2.5rem] h-[2.5rem]"/>
    </div>
    <div class="flex flex-col flex-1 space-y-1">
      <span class="text-h3 leading-h3 text-not-black font-semibold"
      >{{
          value ? (value | number ) : 0
        }}<span *ngIf="icon === 'revenue' || icon === 'cr-d'"> ৳</span>
      <span *ngIf="icon ==='margin'">%</span></span
      >

      <span class="text-body_title leading-body_title text-not-primary">{{
          title
        }}</span>
    </div>
  </div>
  <span class="text-body text-secondary" *ngIf="!dateFilterAvailable">
    {{ text }}
  </span>
</div>
