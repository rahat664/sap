<div class="px-6 py-5 bg-white rounded-lg flex flex-col h-full space-y-[0.875rem]">
  <div class="flex justify-between items-center">
    <h2 class="text-h2 leading-h2 font-semibold text-not-black">
      Status Highlight
    </h2>
    <!--    <mat-form-field appearance="outline" class="w-[12rem]">-->

    <!--        placeholder="Select Vendor">-->

    <!--    </mat-form-field>-->
  </div>
  <div class="grid lg:grid-cols-2 gap-3 cursor-pointer">
    <app-status-card routerLink="/trip-list" icon="revenue" title="Total revenue (GP)"
                     [value]="dashboardStats?.grossProfitStat?.totalGrossProfit"
                     text="{{dashboardStats?.grossProfitStat?.totalGrossProfitWithinTheDateRange ? (dashboardStats?.grossProfitStat?.totalGrossProfitWithinTheDateRange |number) : 0}} ৳ this month"
                     backgroundColor="bg-[#1DBF73]"
                     textColor="text-[#009D54]"></app-status-card>
    <app-status-card routerLink="/profile/customer" icon="customers" title="Total customer"
                     [value]="customerStatistics?.totalCustomers"
                     text="{{customerStatistics?.totalCustomersOnboardedWithinGivenDateRange ? (customerStatistics?.totalCustomersOnboardedWithinGivenDateRange |number) : 0}} new onboarded this month"
                     backgroundColor="bg-[#FFA711]"
                     textColor="text-[#CD8304]"></app-status-card>
    <app-status-card routerLink="/trip-list" icon="cr-d" title="Total customer rate"
                     [value]="dashboardStats?.customerRateStat?.totalCustomerRate"
                     text="{{dashboardStats?.customerRateStat?.totalCustomerRateWithinTheDateRange ? (dashboardStats?.customerRateStat?.totalCustomerRateWithinTheDateRange | number) : 0}} ৳ this month"
                     backgroundColor="bg-[#F0614E]"
                     textColor="text-[#F0614E]"></app-status-card>
    <app-status-card (click)="localStorage.setItem('filter', 'Completed')" routerLink="/trip-list" icon="totaltrip"
                     title="Total trip completed"
                     [value]="dashboardStats?.tripCountStat?.totalTripsCompleted"
                     text="{{dashboardStats?.tripCountStat?.totalTripsCompletedWithinTheDateRange ? (dashboardStats?.tripCountStat?.totalTripsCompletedWithinTheDateRange | number) : 0}} trip this month"
                     backgroundColor="bg-[#0CD5F0]"
                     textColor="text-[#049FB4]"></app-status-card>
  </div>
</div>
