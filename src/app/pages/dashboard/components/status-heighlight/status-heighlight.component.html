  <div class="grid md:grid-cols-5 gap-3 cursor-pointer">
    <app-status-card
      subtitles="Total Revenue"
      [dateFilterAvailable]="dateFilterAvailable"
      routerLink="/trip-list"
      icon="revenue"
      [value]="dateFilterAvailable ? dashboardStats?.grossProfitStat?.totalGrossProfitWithinTheDateRange : dashboardStats?.grossProfitStat?.totalGrossProfit"
      text="{{
        dashboardStats?.grossProfitStat?.totalGrossProfitWithinTheDateRange
          ? ( Math.round(dashboardStats?.grossProfitStat?.totalGrossProfitWithinTheDateRange)
            | number)
          : 0
      }} ৳ this month"
      backgroundColor="bg-[#1DBF73]"
      textColor="text-[#009D54]"></app-status-card>
    <app-status-card
      subtitles="Total Profit Margin"
      [dateFilterAvailable]="dateFilterAvailable"
      routerLink="/trip-list"
      icon="gp"
      [value]="dateFilterAvailable ? dashboardStats?.tripProfitMarginStat?.dateFilteredProfitMargin : dashboardStats?.tripProfitMarginStat?.totalProfitMargin"
      text="{{
        dashboardStats?.tripProfitMarginStat?.dateFilteredProfitMargin
          ? (dashboardStats?.tripProfitMarginStat?.dateFilteredProfitMargin
            | number)
          : 0
      }}% this month"
      backgroundColor="bg-[#1DBF73]"
      textColor="text-[#009D54]"></app-status-card>
    <app-status-card
      subtitles="Total Customer Rate"
      [dateFilterAvailable]="dateFilterAvailable"
      routerLink="/trip-list"
      icon="cr-d"
      [value]="dateFilterAvailable ? dashboardStats?.customerRateStat?.totalCustomerRateWithinTheDateRange : dashboardStats?.customerRateStat?.totalCustomerRate"
      text="{{
        dashboardStats?.customerRateStat?.totalCustomerRateWithinTheDateRange
          ? (Math.round(dashboardStats?.customerRateStat
              ?.totalCustomerRateWithinTheDateRange) | number)
          : 0
      }} ৳ this month"
      backgroundColor="bg-[#1DBF73]"
      textColor="text-[#009D54]"></app-status-card>
    <app-status-card
      subtitles="Total Transporter Rate"
      [dateFilterAvailable]="dateFilterAvailable"
      routerLink="/trip-list"
      icon="tr-d"
      [value]="dateFilterAvailable ? dashboardStats?.transporterRateStats?.dateFilteredRate : dashboardStats?.transporterRateStats?.totalRate"
      text="{{
        dashboardStats?.transporterRateStats?.dateFilteredRate
          ? (Math.round(dashboardStats?.transporterRateStats?.dateFilteredRate)
            | number)
          : 0
      }} ৳ this month"
      backgroundColor="bg-[#FFA711]"
      textColor="text-[#CD8304]"></app-status-card>
    <app-status-card
      subtitles="Total Calculated Trip"
      [dateFilterAvailable]="dateFilterAvailable"
      (click)="localStorage.setItem('filter', 'Completed')"
      routerLink="/trip-list"
      icon="calculated"
      [value]="dateFilterAvailable ? dashboardStats?.tripCountStat?.totalTripsCompletedWithRatesAvailableAndDateRange : dashboardStats?.tripCountStat?.totalTripsCompletedWithRatesAvailable"
      text="{{
        dashboardStats?.tripCountStat?.totalTripsCompletedWithRatesAvailableAndDateRange
          ? (Math.round(dashboardStats?.tripCountStat
              ?.totalTripsCompletedWithRatesAvailableAndDateRange) | number)
          : 0
      }} trip this month"
      backgroundColor="bg-[#FFA711]"
      textColor="text-[#CD8304]"></app-status-card>
    <app-status-card
      subtitles="Total Trip Completed"
      [dateFilterAvailable]="dateFilterAvailable"
      (click)="localStorage.setItem('filter', 'Completed')"
      routerLink="/trip-list"
      icon="totaltrip"
      [value]="dateFilterAvailable ? dashboardStats?.tripCountStat?.totalTripsCompletedWithinTheDateRange : dashboardStats?.tripCountStat?.totalTripsCompleted"
      text="{{
        dashboardStats?.tripCountStat?.totalTripsCompletedWithinTheDateRange
          ? (Math.round(dashboardStats?.tripCountStat
              ?.totalTripsCompletedWithinTheDateRange) | number)
          : 0
      }} trip this month"
      backgroundColor="bg-[#FFA711]"
      textColor="text-[#CD8304]"></app-status-card>
    <app-status-card
      subtitles="Total Customer"
      [dateFilterAvailable]="dateFilterAvailable"
      routerLink="/profile/customer"
      icon="customers"
      [value]="dateFilterAvailable ? customerStatistics?.dateFilteredCount : customerStatistics?.totalCount"
      text="{{
        customerStatistics?.dateFilteredCount
          ? (Math.round(customerStatistics?.dateFilteredCount)
            | number)
          : 0
      }} new onboarded this month"
      backgroundColor="bg-[#F0614E]"
      textColor="text-[#F0614E]"></app-status-card>
    <app-status-card
      subtitles="Total Transporter"
      [dateFilterAvailable]="dateFilterAvailable"
      routerLink="/profile/transporter"
      icon="transporter"
      [value]="dateFilterAvailable ? transporterStatistics?.dateFilteredCount : transporterStatistics?.totalCount"
      text="{{
        transporterStatistics?.dateFilteredCount
          ? (Math.round(transporterStatistics?.dateFilteredCount) | number)
          : 0
      }} new onboarded this month"
      backgroundColor="bg-[#0CD5F0]"
      textColor="text-[#049FB4]"></app-status-card>
    <app-status-card
      subtitles="Total Truck"
      [dateFilterAvailable]="dateFilterAvailable"
      routerLink="/profile/truck"
      icon="total-truck"
      [value]="dateFilterAvailable ? dashboardStats?.truckCountStat?.dateFilteredCount : dashboardStats?.truckCountStat?.totalCount"
      text="{{
        dashboardStats?.truckCountStat?.dateFilteredCount
          ? (Math.round(dashboardStats?.truckCountStat?.dateFilteredCount)
            | number)
          : 0
      }} new onboarded this month"
      backgroundColor="bg-[#F0614E]"
      textColor="text-[#F0614E]"></app-status-card>
    <app-status-card
      subtitles="Total Driver"
      [dateFilterAvailable]="dateFilterAvailable"
      icon="driver"
      routerLink="/profile/driver"
      [value]="dateFilterAvailable ? driverStatistics?.dateFilteredCount : driverStatistics?.totalCount"
      text="{{
        driverStatistics?.dateFilteredCount
          ? (Math.round(driverStatistics?.dateFilteredCount) | number)
          : 0
      }} new onboarded this month"
      backgroundColor="bg-[#0CD5F0]"
      textColor="text-[#049FB4]"></app-status-card>
  </div>
</div>
