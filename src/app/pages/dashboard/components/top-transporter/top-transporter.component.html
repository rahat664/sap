<div class="px-6 py-5 bg-white rounded-lg flex flex-col space-y-[0.875rem]">
  <div class="flex justify-between items-center">
    <h2 class="text-h2 leading-h2 font-semibold text-not-black">
      Top Transporter
    </h2>
    <mat-form-field appearance="outline" class="w-[12rem] filter">
      <mat-select [(ngModel)]="sortBy"
                  (selectionChange)="changeSorting($event)"
                  placeholder="Select sorting">
        <mat-option value="grossProfit">Gross Profit</mat-option>
        <mat-option value="totalTrip">No. of Trips</mat-option>
      </mat-select>
    </mat-form-field>
  </div>
  <div
    routerLink="/profile/transporter"
    class="cursor-pointer flex flex-col space-y-4">
    <div
      class="grid grid-cols-4 gap-3 w-full py-1.5 text-body_title border-b border-link text-not-black font-semibold">
      <span>Transporter</span>
      <span class="text-center w-full">No. of Trips</span>
      <span class="text-center">TR(৳)</span>
      <span class="text-center">GP(৳)</span>
    </div>
    <ng-container *ngIf="!loading">
      <div class="flex flex-col space-y-5">
        <ng-container *ngFor="let transporter of topTransporter">
          <div
            class="grid grid-cols-4 items-center w-full text-body text-not-black">
            <div class="flex space-x-3 items-center">
              <div
                class="text-body_title text-white flex justify-center items-center h-[1.75rem] w-[1.75rem] rounded-full {{
                getBackgroundColor(
                  transporter.transporterName[0].toLocaleLowerCase()
                )
              }} font-semibold">
              <span>{{
                  transporter.transporterName[0].toLocaleUpperCase()
                }}</span>
              </div>
              <span class="flex-1">{{ transporter.transporterName }}</span>
            </div>
            <span class="text-center w-full">{{ transporter.noOfTrips }}</span>
            <span class="text-center">{{
                transporter.totalTR | number
              }}</span>
            <span class="text-center">{{
                transporter.totalProfit | number
              }}</span>
          </div>
        </ng-container>
      </div>
    </ng-container>
    <ng-container *ngIf="loading">
        <div class="min-h-60 flex items-center w-full justify-center">
          <app-loading></app-loading>
        </div>
    </ng-container>
  </div>
</div>
