<div class="flex flex-col space-y-3 md:mx-3 pb-4">
  <div
    appGetElementHeight
    (height)="height = $event"
    class="flex flex-col space-y-3 sticky top-16 z-50 bg-app-bg py-3">
    <div
      class="flex flex-col py-[1.375rem] sm:py-[1.125rem] md:py-[1rem] md:py-[0.875rem] xl:py-[0.75rem] 2xl:py-[0.625rem] space-y-3 md:space-y-0 md:flex-row justify-between">
      <div class="flex justify-between w-full items-center px-3">
        <h1 class="text-h1_mobile leading-h1_mobile md:text-h1 md:leading-h1 font-semibold">Dashboard</h1>
        <button (click)="onClickFilterOpen()" class="cursor-pointer flex space-x-1  text-h2_medium text-primary">
          <img class="notPreview" src="assets/svg/filter.svg" alt="">
          <p>Filter</p>
        </button>
      </div>
    </div>

    <div *ngIf="filterApplied" class="w-full justify-between flex border border-blue items-center px-2 py-2 bg-input rounded-lg">
      <span class="text-xs text-not-black">Showing results for <span [innerHTML]="filterSummary"></span></span>
      <a class="text-red test xs cursor-pointer" (click)="onCLickClearAll()">Clear all</a>
    </div>
  </div>
    <div class="grid max-h-[82.5vh] overflow-y-auto md:grid-cols-4 gap-3">
      <div class="md:col-span-4 h-full rounded-lg">
        <app-status-heighlight></app-status-heighlight>
      </div>
      <div class="md:w-full w-screen md:col-span-2 h-full rounded-lg">
        <app-month-wise-revenue></app-month-wise-revenue>
      </div>
      <div class="h-full md:w-full w-screen md:col-span-2 bg-white rounded-lg">
        <app-challan-status></app-challan-status>
      </div>
      <div class="h-full md:w-full w-screen md:col-span-2  bg-white rounded-lg">
        <app-top-transporter></app-top-transporter>
      </div>
      <div
        class="h-full md:w-full w-screen flex  items-start bg-white md:col-span-2 rounded-lg">
        <app-top-customer class="w-full"></app-top-customer>
      </div>
      <div class="h-full md:w-full w-screen md:col-span-4 bg-white rounded-lg">
        <app-transporter-rate-analysis></app-transporter-rate-analysis>
      </div>
    </div>
</div>
