    <div *ngIf="isLoading | async" class="loading-overlay">
      <div class="spinner"></div>
    </div>

</ng-container>
<ng-container *ngIf="isLoginPage() || isAboutPage() || isSupportPage()">
  <div *ngIf="isLoading | async" class="loading-overlay">
    <div class="spinner"></div>
  </div>
  <router-outlet></router-outlet>
</ng-container>
