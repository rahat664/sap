<div *ngIf="isOpen" class="fixed z-50 inset-0 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white relative rounded-lg max-w-[75vw]">
    <button (click)="closeModal()"
            class="absolute -top-3 -right-3 bg-white p-1 h-4 w-4 rounded-full flex items-center justify-center">
      <i class="fal fa-times text-sm"></i>
    </button>
    <div>
      <ng-content></ng-content>
    </div>
  </div>
</div>
