<button [ngClass]="{'bg-link' : !buttonColor}" class="py-2 px-4 flex text-link items-center bg-opacity-10 bg-{{buttonColor}} space-x-3 w-full h-full text-body rounded-md">
  <ng-container *ngIf="isIconButton">
    <i *ngIf="!file" class="far fa-{{icon}}"></i>
    <img class="notPreview" *ngIf="file" src="assets/svg/{{icon}}.svg" alt="">
  </ng-container>
  <span [ngClass]="{'text-link' : !buttonColor}" class="text-{{buttonColor}}">{{buttonText}}</span>
</button>
