<button
  [ngClass]="{'bg-link': !buttonColor}"
  [disabled]="isDisabled"
  class="py-2 px-4 flex text-link items-center bg-opacity-10 {{buttonColor}} space-x-3 w-full h-full text-body rounded-md">
  <ng-container *ngIf="isIconButton">
    <i *ngIf="!file" class="far fa-{{ icon }}"></i>
    <img
      class="notPreview"
      *ngIf="file"
      ngSrc="assets/svg/{{ icon }}.svg"
      alt="" />
  </ng-container>
  <span *ngIf="buttonText"
        [ngClass]="{ 'text-link': !textColor }"
        class="{{textColor}}"
  >{{ buttonText }}</span
  >
</button>
