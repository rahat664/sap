<div class="time-picker bg-white shadow-md p-4 rounded-lg flex items-center justify-center">
  <div class="flex flex-col items-center">
    <span class="text-gray-500 cursor-pointer" (click)="increaseHour()">
      <i class="fa fa-caret-up" aria-hidden="true"></i>
    </span>
    <input type="number" [(ngModel)]="hour"
           [min]="1" [max]="12"
           class="text-gray-700 text-center rounded-lg border-none outline-none bg-transparent"
    >
    <span class="text-gray-500 cursor-pointer" (click)="decreaseHour()">
      <i class="fa fa-caret-down" aria-hidden="true"></i>
    </span>
  </div>
  <div class="mx-2 text-black bold">:</div>
  <div class="flex flex-col items-center">
    <span class="text-gray-500 cursor-pointer" (click)="increaseMinute()">
      <i class="fa fa-caret-up" aria-hidden="true"></i>
    </span>
    <input type="number" [(ngModel)]="minute"
           [max]="60"
           [min]="0"
           class="text-gray-700 text-center border-none outline-none bg-transparent rounded-lg">
    <span class="text-gray-500 cursor-pointer" (click)="decreaseMinute()">
      <i class="fa fa-caret-down" aria-hidden="true"></i>
    </span>
  </div>
  <div class="flex">
    <span class="text-gray-500 cursor-pointer" (click)="togglePeriod()">
      AM
    </span>
    <span class="text-gray-500 cursor-pointer" (click)="togglePeriod()">
      PM
    </span>
  </div>
</div>
