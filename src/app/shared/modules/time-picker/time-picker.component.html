<div class="w-full flex items-center justify-center p-4">
  <div class="flex space-x-3 items-center w-80 justify-center">
    <div class="flex space-x-1 items-center">
      <mat-form-field class="w-[3.5rem]" appearance="outline">
        <input (change)="onHourChange($event)" (keypress)="onKeyPressHour($event)" matInput
               [(ngModel)]="currentHourShow">
      </mat-form-field>
      <div class="h-[3.5rem] flex items-center justify-center">
        <img class="mt-2" src="assets/svg/clone.svg" alt="clone">
      </div>
      <mat-form-field class="w-[3.5rem]" appearance="outline">
        <input (change)="onMinuteChange($event)" (keypress)="onkeyPressMinute($event)" matInput
               [(ngModel)]="currentMinute">
      </mat-form-field>
    </div>
    <div class="flex space-x-1 text-h2 font-semibold">
      <button
        (click)="toggleTimeState()"
        [ngClass]="{'text-input-hint' : getTimeStateAmOrPm() === 'PM', 'text-not-black' : getTimeStateAmOrPm() === 'AM'}"
        class="w-[3.5rem] h-[3.5rem] hover:bg-input rounded-lg" type="button">AM
      </button>
      <button
        (click)="toggleTimeState()"
        [ngClass]="{'text-input-hint' : getTimeStateAmOrPm() === 'AM', 'text-not-black' : getTimeStateAmOrPm() === 'PM'}"
        class="w-[3.5rem] h-[3.5rem] hover:bg-input rounded-lg" type="button">PM
      </button>
    </div>
  </div>
</div>
