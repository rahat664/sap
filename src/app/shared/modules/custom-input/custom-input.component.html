<div>
  <mat-form-field class="w-full" appearance="outline">
    <mat-select #select (selectionChange)="onClickOption($event, select)" [(value)]="selectedValue"
                [placeholder]="inputPlaceholder">
      @for (option of options; track option) {
        <mat-option [value]="option.id">{{ option.showname ? option.showname : option.value }}</mat-option>
        <div
          *ngIf="customOpened"
          class="absolute top-0 h-full left-full w-[30rem] bg-input p-4 rounded-lg border border-input-hint text-[0.875rem]">
          <div>
            <div class="flex justify-between items-center">
              <h1>Custom Date Range</h1>
              <a (click)="onClickApply(select)" class="cursor-pointer text-link">Apply</a>
            </div>
            <div class="flex flex-col space-y-3">
              <div class="flex flex-col space-y-1">
                <label class="font-semibold" for="fromDate">From</label>
                <div id="fromDate" class="grid grid-cols-3 gap-4">
                  <ng-select
                    [searchable]="false"
                    [clearable]="false"
                    placeholder="Month"
                    [ngModel]="selectedFromMonthInString"
                    (ngModelChange)="onFromMonthChange($event)">
                    <ng-option *ngFor="let month of months" [value]="month">{{
                        month
                      }}
                    </ng-option>
                  </ng-select>
                  <ng-select
                    [searchable]="false"
                    [clearable]="false"
                    placeholder="Day"
                    [ngModel]="selectedFromDay"
                    (ngModelChange)="onFromDayChange($event)">
                    <ng-option *ngFor="let day of days" [value]="day">{{
                        day
                      }}
                    </ng-option>
                  </ng-select>
                  <ng-select
                    [searchable]="false"
                    [clearable]="false"
                    placeholder="Year"
                    [ngModel]="selectedFromYear"
                    (ngModelChange)="onFromYearChange($event)">
                    <ng-option *ngFor="let year of years" [value]="year">{{
                        year
                      }}
                    </ng-option>
                  </ng-select>
                </div>
              </div>

              <div class="flex flex-col space-y-1">
                <label class="font-semibold" for="toDate">To</label>
                <div id="toDate" class="grid grid-cols-3 gap-4">
                  <ng-select
                    [searchable]="false"
                    [clearable]="false"
                    placeholder="Month"
                    [ngModel]="selectedToMonthInString"
                    (ngModelChange)="onToMonthChange($event)">
                    <ng-option *ngFor="let month of months" [value]="month">{{
                        month
                      }}
                    </ng-option>
                  </ng-select>
                  <ng-select
                    [searchable]="false"
                    [clearable]="false"
                    placeholder="Day"
                    [ngModel]="selectedToDay"
                    (ngModelChange)="onToDayChange($event)">
                    <ng-option *ngFor="let day of days" [value]="day">{{
                        day
                      }}
                    </ng-option>
                  </ng-select>
                  <ng-select
                    [searchable]="false"
                    [clearable]="false"
                    placeholder="Year"
                    [ngModel]="selectedToYear"
                    (ngModelChange)="onToYearChange($event)">
                    <ng-option *ngFor="let year of years" [value]="year">{{
                        year
                      }}
                    </ng-option>
                  </ng-select>
                </div>
              </div>
            </div>
          </div>
        </div>
      }
    </mat-select>
  </mat-form-field>
</div>
