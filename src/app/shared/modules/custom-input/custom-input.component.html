<div>
  <mat-form-field class="w-full" appearance="outline">
    <mat-select
      #select
      (selectionChange)="onClickOption($event, select)"
      [(value)]="selectedValue"
      [placeholder]="inputPlaceholder">
      @for (option of options; track option) {
        <mat-option
          (click)="onClickMatOption(option.id, select)"
          [value]="option.id"
        >{{ option.showname ? option.showname : option.value }}
        </mat-option>
        <div
          class="w-full h-full border border-input-hint absolute right-0 top-0 rounded-lg bg-transparent pointer-events-none"
          [ngClass]="{ 'border-r-0 rounded-r-none': customOpened }"></div>
        <div
          *ngIf="customOpened"
          class="absolute top-0 h-full left-full w-[30rem] bg-[#FBFEFF] p-4 rounded-r-lg border border-input-hint border-l-0 text-body leading-body">
          <div class="flex flex-col space-y-3">
            <div class="flex justify-between items-center">
              <h1>Select Date Range</h1>
              <a (click)="onClickApply(select)" class="cursor-pointer text-link"
              >Apply</a
              >
            </div>
            <div class="flex items-center w-full h-full">
              <div class="flex w-full flex-col space-y-3">
                <div class="flex flex-col space-y-1">
                  <label class="font-semibold" for="fromDate">From</label>
                  <div id="fromDate" class="grid grid-cols-3 gap-1">
                    <ng-select
                      [searchable]="false"
                      [clearable]="false"
                      placeholder="Month"
                      [ngModel]="selectedFromMonthInString"
                      (ngModelChange)="onFromMonthChange($event)">
                      <ng-option *ngFor="let month of months" [value]="month"
                      >{{ month }}
                      </ng-option>
                    </ng-select>
                    <ng-select
                      [searchable]="false"
                      [clearable]="false"
                      placeholder="Day"
                      [ngModel]="selectedFromDay"
                      (ngModelChange)="onFromDayChange($event)">
                      <ng-option *ngFor="let day of days" [value]="day"
                      >{{ day }}
                      </ng-option>
                    </ng-select>
                    <ng-select
                      [searchable]="false"
                      [clearable]="false"
                      placeholder="Year"
                      [ngModel]="selectedFromYear"
                      (ngModelChange)="onFromYearChange($event)">
                      <ng-option *ngFor="let year of years" [value]="year"
                      >{{ year }}
                      </ng-option>
                    </ng-select>
                  </div>
                </div>

                <div class="flex flex-col space-y-1">
                  <label class="font-semibold" for="toDate">To</label>
                  <div id="toDate" class="grid grid-cols-3 gap-4">
                    <ng-select
                      [searchable]="false"
                      [clearable]="false"
                      placeholder="Month"
                      [ngModel]="selectedToMonthInString"
                      (ngModelChange)="onToMonthChange($event)">
                      <ng-option *ngFor="let month of months" [value]="month"
                      >{{ month }}
                      </ng-option>
                    </ng-select>
                    <ng-select
                      [searchable]="false"
                      [clearable]="false"
                      placeholder="Day"
                      [ngModel]="selectedToDay"
                      (ngModelChange)="onToDayChange($event)">
                      <ng-option *ngFor="let day of days" [value]="day"
                      >{{ day }}
                      </ng-option>
                    </ng-select>
                    <ng-select
                      [searchable]="false"
                      [clearable]="false"
                      placeholder="Year"
                      [ngModel]="selectedToYear"
                      (ngModelChange)="onToYearChange($event)">
                      <ng-option *ngFor="let year of years" [value]="year"
                      >{{ year }}
                      </ng-option>
                    </ng-select>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      }
    </mat-select>
  </mat-form-field>
</div>
