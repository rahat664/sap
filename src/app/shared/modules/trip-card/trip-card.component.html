<button [ngClass]="{'border border-primary': isActivated}"
        class="bg-white p-4 w-full flex flex-col rounded-2xl space-y-3 max-w-96">
  <div class="flex justify-between items-start w-full">
    <div class="flex flex-col space-y-1 items-start">
      <span class="text-body_title leading-body_title text-not-black font-semibold">{{ tripNumber }}</span>
      <span class="text-body text-secondary">{{ companyName }}</span>
    </div>
    <div class="px-2 py-1 {{getTripColorBasedOnStatus(tripStatus)}} text-white rounded-full text-xs">
      {{ tripStatus }}
    </div>
  </div>
  <div class="flex flex-col space-y-3 items-start text-xs">
    <span class="text-secondary">{{ tripStartDateTime | date : 'd MMM,yyyy, h:mm a' }}</span>
    <div class="flex flex-col space-y-3 text-not-black text-start">
      <div class="step">
        <div class="circle">
          <img src="assets/svg/start.svg" alt="loading">
        </div>
        <div class="flex items-center justify-between"><p class="w-full">
          {{ loadingPoint[0]?.pointName }}
        </p>
          <p *ngIf="loadingPoint.length > 1" class="h-5 w-5 flex items-center justify-center  rounded-full  text-white bg-blue text-[0.625rem]">
            <span>+{{ loadingPoint.length - 1 }}</span>
          </p>
        </div>
      </div>
      <div class="step">
        <div class="circle">
          <img src="assets/svg/end.svg" alt="loading"></div>
        <div class="flex items-center justify-between"><p class="w-full">
          {{ unloadingPoint[unloadingPoint.length - 1]?.pointName }}
        </p>
          <p *ngIf="unloadingPoint.length > 1" class="h-5 w-5 flex items-center justify-center  rounded-full  text-white bg-blue text-[0.625rem]">
            <span>+{{ unloadingPoint.length - 1 }}</span>
          </p>
        </div>
      </div>
    </div>
    <span class="text-secondary text-start">{{ truckId }} | {{ truckType }} | {{ goodsName }}</span>
  </div>
</button>
