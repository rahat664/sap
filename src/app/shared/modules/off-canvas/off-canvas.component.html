<div
  class="fixed top-0 right-0 w-[26rem] bg-white  h-full flex flex-col z-50 shadow-lg justify-between px-8 pb-6 transform transition-transform translate-x-0">
  <div
    class="h-full flex flex-col space-y-8  py-6 ">
    <div class="flex items-center justify-between">
      <h2 class="text-h3 leading-h3 font-semibold">Payment Details</h2>
      <button (click)="onClose()" class="text-gray-500 hover:text-black">
        <i class="fal fa-times text-xl text-primary"></i>
      </button>
    </div>
    <div class="flex flex-col space-y-4">
      <div class="flex flex-col space-y-0.5 text-left px-4 py-3 bg-app-bg rounded-lg">
        <span class="text-not-black text-xs font-semibold">Trip no: 123456</span>
        <span class="text-body_title leading-body_title font-semibold  text-not-black">Dhaka metro TA 11-7895</span>
        <span class="text-body text-secondary">Fair Electronics Bangladesh Lt66d</span>
      </div>
      <div class="flex flex-col">
        <span class="text-secondary text-body"><sup>*</sup>Please chose the payment status</span>
        <mat-radio-button class="text-not-black" value="partial" [checked]="paymentStatus === 'partial'"
                          (change)="onPaymentStatusChange($event)">
          Partial
        </mat-radio-button>
        <mat-radio-button class="text-not-black" value="full" [checked]="paymentStatus === 'full'"
                          (change)="onPaymentStatusChange($event)">
          Full
        </mat-radio-button>
      </div>
      <div class="flex flex-col">
        <h1 class="py-1.5 px-3.5 text-secondary text-body border-line border-b">Payment info</h1>
        <div class="flex justify-between items-center mx-6 border-b border-dotted border-line py-2">
          <span class="text-body text-not-black">Transporter Rate</span>
          <span class="text body text-not-black">20000(৳)</span>
        </div>
        <div class="flex justify-between items-center mx-6 border-b border-dotted border-line py-2">
          <span class="text-body text-not-black">Paid</span>
          <span class="text body text-not-black">0(৳)</span>
        </div>
        <div class="flex justify-between items-center mx-6 border-line py-2">
          <span class="text-body text-not-black">Payable</span>
          <span class="text body text-not-black">20000(৳)</span>
        </div>
      </div>
      <div class="bg-input rounded-lg py-2">
        <h1 class="text-secondary  text-sm text-center w-full">Pay now(৳)</h1>
        <mat-form-field appearance="outline" class="w-full" style="outline: none !important;">
          <input class=" text-center" matInput type="number" placeholder="Enter amount here" [(ngModel)]="amount" />
        </mat-form-field>
      </div>
    </div>
    <div class="flex flex-col space-y-4">
      <span class="text-secondary text-body font-normal">Select payment method</span>
      <div class="flex flex-col space-y-1">
        <ng-container *ngFor="let method of paymentMethods">
          <div class="flex items-center w-full space-x-3 py-2 px-3 bg-input rounded-lg">
            <mat-radio-button class="text-not-black" [value]="method.name"
                              (change)="onPaymentMethodChange($event)">
            </mat-radio-button>
            <img src="assets/svg/{{method.icon}}">
            <span class="text-body_title font-medium leading-body_title text-not-black">{{method.name}}</span>
          </div>
        </ng-container>
      </div>
    </div>
  </div>
  <div class="bottom-0 w-full justify-self-end">
    <button class="bg-primary text-white rounded-lg py-2 font-semibold w-full" (click)="onPayNow()">Make Payment
    </button>
  </div>

</div>
