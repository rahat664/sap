<google-map
  [height]=calculatedHeight()
  width="100%"
  [center]="center"
  [zoom]="zoom"
  [options]="options"
>
  <map-marker *ngIf="initialMarker.position" [options]="initialMarker"></map-marker>
  <ng-container>
    <map-marker *ngFor="let marker of startMarker" [options]="marker"></map-marker>
  </ng-container>
  <ng-container *ngIf="endMarker.length > 0">
    <map-marker *ngFor="let marker of endMarker" [options]="marker"></map-marker>
  </ng-container>
  <ng-container *ngIf="polylines.length > 0">
    <map-polyline *ngFor="let polyline of polylines" [options]="polyline"></map-polyline>
  </ng-container>
</google-map>
