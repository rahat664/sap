<div *ngIf="isOpen"  class="fixed rounded-lg z-50 inset-0 flex items-center justify-center bg-black bg-opacity-50">
  <div class="bg-white relative rounded-lg flex items-center justify-center  max-w-[25vw] max-h-[25vw]">
    <button (click)="closeModal()"
            class="absolute top-4 right-4 p-1 h-4 w-4 flex items-center justify-center">
      <i class="fal fa-times text-lg"></i>
    </button>
    <div appGetOutsideModalClick (clickOutside)="onClick($event)">
      <div class="flex flex-col p-12 items-center space-y-4 justify-center w-full">
        <div class="flex flex-col space-y-3 items-center" *ngIf="buttonText === 'Removed'">
          <div class="flex items-center justify-center h-16 bg-red w-16 rounded-full">
            <img src="./assets/svg/user-remove-white.svg" alt="">
          </div>
          <h1 class="text-h1_mobile font-bold text-not-black">Attention</h1>
        </div>
        <div class="flex flex-col space-y-3 items-center" *ngIf="buttonText === 'Active'">
          <div class="flex items-center justify-center h-16 bg-green w-16 rounded-full">
            <img src="./assets/svg/user-active-white.svg" alt="">
          </div>
          <h1 class="text-h1_mobile font-bold text-not-black">Attention</h1>
        </div>
        <div class="flex flex-col space-y-3 items-center" *ngIf="buttonText === 'Inactive'">
          <div class="flex items-center justify-center h-16 bg-another w-16 rounded-full" >
            <img src="./assets/svg/user-inactive-white.svg" alt="">
          </div>
          <h1 class="text-h1_mobile font-bold text-not-black">Attention</h1>
        </div>
        <span *ngIf="buttonText === 'Inactive'" class="text-center text-web-text-secondary mt-4">"{{userName}}" will be mark as inactive</span>
        <span *ngIf="buttonText === 'Active'" class="text-center text-web-text-secondary mt-4">"{{userName}}" will be mark as active</span>
        <span *ngIf="buttonText === 'Removed'" class="text-center text-web-text-secondary mt-4">"{{userName}}" will be removed from the list</span>
        <button *ngIf="buttonText === 'Active'"  (click)="performChangeStatuses()" class="bg-green text-white px-4 py-2 mt-4 rounded-lg">Mark as Active</button>
        <button *ngIf="buttonText === 'Inactive'" (click)="performChangeStatuses()" class="bg-another text-white px-4 py-2 mt-4 rounded-lg">Mark as Inactive</button>
        <button *ngIf="buttonText === 'Removed'" (click)="performChangeStatuses()" class="bg-red text-white px-4 py-2 mt-4 rounded-lg">Remove</button>
      </div>
    </div>
  </div>
</div>
