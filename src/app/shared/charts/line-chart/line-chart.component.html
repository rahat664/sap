
<div class="relative flex flex-col space-y-4">
  <!-- Sticky Y-Axis Container -->
  <div class="absolute z-10 w-16 bg-white " #yAxisStickyContainers>
    <div class="y-axis-sticky h-full" #yAxisContainers></div>
  </div>
  <!-- Scrollable Chart Container -->
  <div class="overflow-x-auto w-full">
    <div class="chart-content w-full overflow-x-auto scroll-smooth" #chartContainers style="overflow-x: auto; white-space: nowrap; width: 100%;">
      <apx-chart #chart
        [series]="chartOptions?.series"
        [chart]="chartOptions?.chart"
        [xaxis]="chartOptions?.xaxis"
        [yaxis]="chartOptions?.yaxis"
        [dataLabels]="chartOptions?.dataLabels"
        [annotations]="chartOptions?.annotations"
        [plotOptions]="chartOptions?.plotOptions"
        [grid]="chartOptions?.grid"
        [stroke]="chartOptions?.stroke"
        [title]="chartOptions?.title"
        [legend]="chartOptions?.legend"
        [tooltip]="chartOptions?.tooltip"></apx-chart>
    </div>
  </div>
<!--  make custom legends-->
  <div class="flex w-full items-center justify-center">
    <div class="flex items-center space-x-3 text-secondary text-left ">
      <div class="flex items-center space-x-1.5" *ngFor="let legend of colors; index as i">
        <div *ngIf="seriesData[i]?.name" class="w-[13px] h-[13px] bg-[{{legend}}] rounded-[2px]"></div>
        <span class="text-xs">{{seriesData[i]?.name}}</span>
      </div>
    </div>
  </div>
</div>
